<style>

<script>
/* ===== Trickle mockup engine: profiles, seeded history, ledger actions ===== */
const DAY=86400000;

const CATLIB={

   cats:[['Food',300],['Travel',120],['Chai & coffee',140],['Outings',150],['Phone & data',100],['College & study',100],['Snacks',60]],W:1100,
   bills:[['Spotify',119,'month',5]],goals:[['Concert',5000,1800,10,5]],free:0},

   cats:[['Food',450],['Travel',200],['Phone & data',100],['College & study',100],['Chai & coffee',150],['Snacks',150],['Outings',300]],W:1700,
   bills:[['Spotify',119,'month',5],['Netflix',199,'month',9]],goals:[['Laptop',30000,10500,26,9],['Trip',6000,4200,12,5]],free:0},
 N:{key:'N',name:'Nishad',blurb:'₹25k a month · 12 categories · big bills',mode:'upi',income:25000,savingsShare:5000,lasts:4.3,bal:17800,weeks:12,
   cats:[['Food',700],['Travel',350],['Phone & data',150],['College & study',300],['Chai & coffee',250],['Snacks',200],['Groceries',300],['Eating out',350],['Movies',150],['Gadgets',200],['Clothes',150],['Outings',250]],W:4650,
   bills:[['Hostel fee',4000,'month',1],['Spotify',119,'month',5],['Gym',800,'month',3]],goals:[['MacBook',90000,30000,24,8],['Europe trip',60000,12000,18,6]],free:600},
 H:{key:'H',name:'Harsh',blurb:'₹12k a month · 18 categories · 3 goals',mode:'upi',income:12000,savingsShare:3000,lasts:4.3,bal:7400,weeks:12,
   cats:[['Food',300],['Travel',150],['Phone & data',90],['College & study',100],['Personal care',60],['Other basics',50],['Chai & coffee',100],['Snacks',120],['Groceries',160],['Eating out',150],['Food delivery',100],['Petrol',120],['Bike upkeep',60],['Wi-Fi & data',60],['Laundry',50],['Movies',70],['Games',50],['Outings',80]],W:2100,
   bills:[['Wi-Fi',399,'month',12],['Prime',179,'month',20]],goals:[['Bike',60000,12000,40,8],['Laptop',40000,18000,38,7],['Trip',10000,6000,0,6]],free:0}

const GOAL_STARTMONTHS={};
const weeksPer=4.3;
const r5=x=>Math.round(x/5)*5;
const startOfWeek=d=>{const x=new Date(d);x.setHours(0,0,0,0);const k=(x.getDay()+6)%7;return new Date(x.getTime()-k*DAY)};
const NOW0=new Date(2026,9,2,17,30,0); // Fri 2 Oct 2026, 5:30 pm
function billWeekly(b){const per=b.every==='month'?weeksPer:b.every==='3 months'?13:52;return b.amt/per}
function newState(key){
 const P=PROFILES[key],rnd=mulberry(key.charCodeAt(0)*977+13);let id=1;const S={key,p:P,now:new Date(NOW0),idc:1,
  cats:P.cats.map((c,i)=>({id:'c'+i,name:c[0],amt:c[1],left:c[1],order:i})),
  bills:P.bills.map((b,i)=>({id:'b'+i,name:b[0],amt:b[1],every:b[2],dueDay:b[3],reserve:Math.round(billWeekly({amt:b[1],every:b[2]})*3),nextDue:null,paid:[]})),
  goals:P.goals.map((g,i)=>({id:'g'+i,name:g[0],target:g[1],saved:g[2],byMonths:g[3],createdMonthsAgo:g[4],state:'active',hist:[],celebrated:false})),
  free:P.free,txns:[],unsorted:[],credits:[],pending:[],log:[],celebrate:[],toasts:[],flags:{bankDecline:false,bankSlow:false,lowBalance:false,linkLost:false},
  weekEndDone:false,moneyIn:[],memory:{},lastSplit:null,history:[]};
 S.fixedWeekly=()=>S.bills.reduce((a,b)=>a+billWeekly(b),0);
 S.W=P.W;S.fixedW=Math.round(S.fixedWeekly());S.flexW=S.W-S.fixedW;S.bufAmt=S.flexW-S.cats.reduce((a,c)=>a+c.amt,0);S.bufLeft=S.bufAmt;
 // bills next due
 S.bills.forEach(b=>{const d=new Date(S.now);let t=new Date(d.getFullYear(),d.getMonth(),b.dueDay);if(t<=S.now)t=new Date(d.getFullYear(),d.getMonth()+1,b.dueDay);b.nextDue=t});
 // seed transactions
 const ws=startOfWeek(S.now),elapsed=((S.now-ws)/DAY)/7;
 const weeks=P.weeks;const hist=[];
 for(let w=weeks;w>=0;w--){const wk=new Date(ws.getTime()-w*DAY*7);const frac=w===0?elapsed:1;
  S.cats.forEach(c=>{const lib=CATLIB[c.name]||{m:[c.name+' Store'],h:[12,18],avg:80};
   const target=c.amt*(w===0?rnd()*.35+.6:rnd()*.45+.55)*frac*(w===0?1.1:1);const spend=Math.min(c.amt*1.0,target);
   let n=Math.max(1,Math.round(spend/lib.avg));if(c.amt<lib.avg*.8)n=rnd()<c.amt/lib.avg?1:0;let acc=0;const list=[];
   for(let i=0;i<n;i++){let a=r5(Math.max(5,lib.avg*(.6+rnd()*.8)));list.push(a)}
   const sum=list.reduce((x,y)=>x+y,0)||1;const sc=spend/sum;
   list.forEach(a0=>{const a=Math.max(5,r5(a0*sc));const day=Math.floor(rnd()*7*frac);const dd=new Date(wk.getTime()+day*DAY);const hr=lib.h[Math.floor(rnd()*lib.h.length)];dd.setHours(hr,Math.floor(rnd()*60));if(dd>S.now)return;
    S.txns.push({id:'t'+(id++),t:dd.getTime(),payee:lib.m[Math.floor(rnd()*lib.m.length)],amt:a,kind:'cat',ref:c.id,via:'detected',src:null,week:w});
    if(w===0)c.left-=a})});
  // bills
  S.bills.forEach(b=>{if(w>0&&w%4===0){const dd=new Date(wk.getTime()+3*DAY);dd.setHours(10);S.txns.push({id:'t'+(id++),t:dd.getTime(),payee:b.name,amt:b.amt,kind:'fixed',ref:b.id,via:'detected',src:null,week:w});b.paid.push(dd.getTime())}})
 }
 S.cats.forEach(c=>{c.left=Math.max(0,c.left)});
 S.txns.sort((a,b)=>b.t-a.t);S.idc=id+1;
 // goal histories: 12 months of additions (+) and takeouts (-)
 S.goals.forEach((g,i)=>{const r=mulberry(i*31+key.charCodeAt(0));const m=Math.min(12,g.createdMonthsAgo||0);const base=Math.round((g.saved/Math.max(1,m))/10)*10;g.hist=[];for(let k=0;k<12;k++){if(k<12-m){g.hist.push(0);continue}let v=base*(.5+r()*1.2);if(r()<.12)v=-base*(.2+r()*.4);g.hist.push(Math.round(v/10)*10)}});
 S.cats.sort((a,b)=>b.amt-a.amt);S.cats.forEach((c,i)=>c.order=i);
 if(P.fresh){S.txns=[];S.cats.forEach(c=>c.left=c.amt);S.bufLeft=S.bufAmt;S.bills.forEach(b=>b.paid=[])}
 return S}
/* ===== ledger helpers ===== */
const goalNeeded=(g)=>g.byMonths?Math.ceil(g.target/g.byMonths/10)*10:null;
function weekStart(S){return startOfWeek(S.now)}
function spentThisWeek(S){const ws=weekStart(S).getTime();return S.txns.filter(t=>t.t>=ws&&t.kind!=='fixed').reduce((a,t)=>a+t.amt,0)}

function cascade(S,amt,target){ // target {type:'cat'|'fixed'|'goal',id}
 const res={amt,target:0,buffer:0,others:0,savings:0,unfunded:0,othersDetail:{},savingsDetail:{}};let rem=amt;
 const take=(obj,key,x)=>{const t=Math.min(x,obj[key]);obj[key]-=t;return t};
 if(target.type==='cat'){const c=S.cats.find(x=>x.id===target.id);const t=take(c,'left',rem);res.target=t;rem-=t}
 else if(target.type==='fixed'){const b=S.bills.find(x=>x.id===target.id);const t=take(b,'reserve',rem);res.target=t;rem-=t}
 else if(target.type==='goal'){const g=S.goals.find(x=>x.id===target.id);const t=take(g,'saved',rem);res.target=t;rem-=t}
 else if(target.type==='buffer'){const t=take(S,'bufLeft',rem);res.target=t;rem-=t}
 else if(target.type==='free'){const t=take(S,'free',rem);res.target=t;rem-=t}
 else if(target.type==='unsorted'){const t=take(S,'bufLeft',rem);res.target=0;res.buffer=t;rem-=t;if(rem>0){/* continue cascade below */}}
 if(rem>0&&target.type!=='unsorted'||(rem>0&&target.type==='unsorted')){const b=Math.min(rem,S.bufLeft);if(target.type!=='unsorted'){S.bufLeft-=b;res.buffer+=b;rem-=b}}

  while(rem>0&&pool.length){const share=Math.max(1,Math.floor(rem/pool.length));let moved=0;pool.forEach(c=>{const t=Math.min(share,c.left,rem-moved);c.left-=t;moved+=t;res.othersDetail[c.id]=(res.othersDetail[c.id]||0)+t});rem-=moved;res.others+=moved;pool=pool.filter(c=>c.left>0);if(!moved)break}
 }
 if(rem>0){ // savings: free first, then goals in proportion
  const f=Math.min(rem,S.free);S.free-=f;rem-=f;res.savings+=f;if(f)res.savingsDetail.free=f;

 }

 if(res.savings>0){S.touched=true;S.touchedAmt=(S.touchedAmt||0)+res.savings}reachedCheck(S);logE(S,`Paid ₹${amt} for ${labelOf(S,target)}${res.buffer||res.others||res.savings?` (buffer ₹${res.buffer}, others ₹${res.others}, savings ₹${res.savings})`:''}`);

 const give=()=>{if(from.type==='goal'){const g=S.goals.find(x=>x.id===from.id);const t=Math.min(amt,g.saved);g.saved-=t;g.hist[11]=(g.hist[11]||0)-t;return t}

 const got=give();if(!got)return 0;
 if(to.type==='goal'){const g=S.goals.find(x=>x.id===to.id);g.saved+=got;g.hist[11]=(g.hist[11]||0)+got}
 else if(to.type==='free')S.free+=got;

 else if(to.type==='cat'){const c=S.cats.find(x=>x.id===to.id);c.left+=got}

 if(P.step==='bal')return `<div class="mbody" style="padding-top:70px"><div class="cap">The week is ending</div><div class="title" style="margin:6px 0 10px">Does your balance still look right?</div><div class="sub">Since you track by hand, a quick check keeps things honest.</div><div class="field" style="margin:18px 0">₹ ${S.p.bal}</div><div class="sm">Not right? A difference becomes “unlogged spends” in your buffer.</div></div>${foot('<button class="btn" data-a="wnext">Looks right</button>')}`;
 if(P.step===1){if(over){const ov=I.tAmt;const topFill=Math.min(100,Math.max(12,Math.round(ov/S.flexW*100)));let g='<div class="lg" style="width:290px;margin:0 auto">';for(let i=0;i<100;i++){const row=Math.floor(i/10);g+=row*10<topFill?`<i style="background:${boxBg(AMBER)};box-shadow:inset 0 1px 0 rgba(255,255,255,.3)"></i>`:'<i style="background:#171C25"></i>'}g+='</div>';
   return `<div class="mbody" style="padding-top:60px"><div class="cap">Week's end</div><div class="title" style="font-size:30px;margin:4px 0 12px">${I.un<=0&&!I.touched?'Nothing left this week.':'Let\'s do better this week.'}</div>${g}<div style="margin:12px 0"><span class="chipscale">1 box ≈ ₹${box}</span></div>${ov?`<div class="title" style="font-size:34px;color:var(--amber)">${money(ov)} over</div><div class="sub">Taken from your savings.</div>`:`<div class="title" style="font-size:34px;color:var(--amber)">Nothing left</div>`}
   ${goals.length?`<div class="cap" style="margin:16px 0 8px">Your goals are waiting</div><div class="col" style="gap:6px">${goals.slice(0,3).map(g=>`<div class="li" style="cursor:default"><span class="d" style="background:${boxBg(GG[S.goals.indexOf(g)%3])}"></span><span class="n">${esc(g.name)}</span><span class="t">${goalEta(g)}</span></div>`).join('')}</div>`:''}</div>${foot('<button class="btn" data-a="wskip">Start the new week</button>')}`}
  let g='<div class="lg" style="width:290px;margin:0 auto">';const lv=Math.round(I.un/S.flexW*100);for(let i=0;i<100;i++){const row=Math.floor(i/10),c=i%10,k=(9-row)*10+c;g+=k<lv?`<i style="background:${boxBg(AMBER)};box-shadow:inset 0 1px 0 rgba(255,255,255,.3)"></i>`:'<i style="background:#171C25"></i>'}g+='</div>';
  return `<div class="mbody" style="padding-top:60px"><div class="cap">Week's end</div><div class="title" style="font-size:30px;margin:4px 0 12px">Here is what you did not spend.</div>${g}<div class="row sp" style="margin:14px 0"><span class="chipscale">1 box ≈ ₹${box}</span></div><div class="title" style="font-size:44px">${money(I.un)} left</div><div class="sub">That is money you can keep.</div></div>${foot('<button class="btn" data-a="wnext">Next</button>')}`}
 if(P.step===2){return `<div class="mbody" style="padding-top:60px"><div class="cap">Where should it go?</div><div class="title" style="font-size:28px;margin:4px 0 14px">${money(I.un)} to keep</div>${goals.length?`<div class="cap" style="margin-bottom:8px">Into these goals</div><div class="col" style="gap:8px">${goals.map(g=>{const on=P.sel.includes(g.id);return `<button class="tile ${on?'on':''}" style="${on?`border-color:${SAVE};background:${SAVE}18`:''}" data-a="wsel|${g.id}"><b><i style="background:${boxBg(GG[S.goals.indexOf(g)%3])}"></i>${esc(g.name)}</b><small>${on?'gets an equal share':'left out'}</small></button>`}).join('')}</div>`:'<div class="card sub">No goals yet, so it goes to free savings.</div>'}</div>${foot(`<div class="col" style="gap:10px"><button class="btn" data-a="wgo|savings">Move to savings</button><button class="btn o" data-a="wgo|next">Move to next week's budget</button></div>`)}`}
 if(P.step===3){const R=P.res;const act=S.goals.filter(g=>g.state!=='done');const tot=act.reduce((a,g)=>a+g.target,0)||1,sv=act.reduce((a,g)=>a+Math.min(g.saved,g.target),0);
  return `<div class="mbody" style="padding-top:60px;text-align:center"><div class="cap">All set</div><div class="title" style="font-size:28px;margin:4px 0 8px">${P.to==='savings'?money(R.un)+' moved to savings':money(R.un)+' added to next week'}</div>${P.to==='savings'?`<div style="display:flex;justify-content:center">${segRing(act,270,Math.round(sv/tot*100)+'%')}</div><div class="sub">Your savings ring, updated.</div>`:`<div class="col" style="gap:6px;text-align:left;margin-top:12px">${S.cats.slice(0,8).map((c,i)=>`<div class="li" style="cursor:default"><span class="d" style="background:${catCol(i)}"></span><span class="n">${esc(c.name)}</span><span class="a">${money(c.amt)}</span></div>`).join('')}<div class="li" style="cursor:default"><span class="d" style="background:${BUFC}"></span><span class="n">Buffer</span><span class="a">${money(S.bufAmt)}</span></div></div>`}</div>${foot('<button class="btn" data-a="wfinish">Done</button>')}`}

 return `<div style="position:absolute;left:0;right:0;bottom:0;padding:26px 22px 30px;border-radius:28px 28px 0 0;background:#121720;box-shadow:0 -20px 60px rgba(0,0,0,.5);border-top:1px solid #2a313d"><div class="cap">${esc(A.cap)}</div><div class="title" style="font-size:28px;margin:6px 0 12px">${esc(A.q)}</div>${A.hint?`<div class="sub">${esc(A.hint)}</div>`:''}${chips}<div class="col" style="gap:10px;margin-top:22px"><button class="btn" data-a="askyes">${esc(A.yes)}</button>${A.no?`<button class="btn q" data-a="askno">${esc(A.no)}</button>`:''}</div></div>`};
function startUpgrade(){window._oldS=S;UI.sheet=null;UI.flow={id:'onb',step:0,d:Object.assign(obInit(),{s:'bal',upgrade:true,mode:S.p.mode,cats:S.cats.map(c=>c.name),limits:true})};render()}
function openAsk(k){UI.popup={id:'ask',k,bg:'rgba(5,7,11,.74)'};UI.flow=null;UI.sheet=null;render()}
H.askv=a=>{UI.popup.v=+a[0]};
H.askyes=()=>{const P=UI.popup,A=ASKS[P.k](P);const keep=A.ok();if(!keep)UI.popup=null;(S.asked=S.asked||{})[P.k]='yes';return true};
H.askno=()=>{const P=UI.popup;(S.asked=S.asked||{})[P.k]='no';UI.popup=null;say('No problem.');return true};

/* ===== TRACK MODE (B-1..B-8): categories only, no budget, no balance ===== */
const wkTot=w=>Math.round(weekSpentAll(S,w,1));
const wkCat=(c,w)=>Math.round(weekSpentBy(S,c.id,w));
function topCat(w){return S.cats.map(c=>[c,wkCat(c,w)]).sort((a,b)=>b[1]-a[1])[0]}
function openWeekPop(){if(S.track){openAsk('recap');return}UI.popup={id:'weekend',step:(S.p.mode==='manual'&&!S.noBal)?'bal':1,sel:S.goals.filter(g=>g.state==='active').map(g=>g.id)}}
H.openweek=()=>{openWeekPop();return true};
/* engine: no cascade while tracking only */
const _doPay=doPay,_detect=detectPayment,_sort=sortTxn,_refile=refileTxn;
doPay=function(S0,o){if(!S0.track)return _doPay(S0,o);const t={id:'t'+(S0.idc++),t:S0.now.getTime(),payee:o.payee||'Payment',amt:o.amt,kind:'cat',ref:o.target.id,via:o.paid?'manual':'trickle',src:null};S0.txns.unshift(t);logE(S0,`Added ₹${o.amt} to ${labelOf(S0,o.target)}`);return {txn:t,res:{amt:o.amt,target:o.amt,buffer:0,others:0,savings:0,unfunded:0}}};
detectPayment=function(S0,payee,amt){if(!S0.track)return _detect(S0,payee,amt);const mem=S0.memory[payee];const t={id:'t'+(S0.idc++),t:S0.now.getTime(),payee,amt,kind:mem?'cat':'unsorted',ref:mem||null,via:'detected',src:null};if(!mem)S0.unsorted.push(t.id);S0.txns.unshift(t);return t};
sortTxn=function(S0,id,catId){if(!S0.track)return _sort(S0,id,catId);const t=S0.txns.find(x=>x.id===id);if(!t||t.kind!=='unsorted')return;t.kind='cat';t.ref=catId;S0.memory[t.payee]=catId;S0.unsorted=S0.unsorted.filter(x=>x!==id)};
refileTxn=function(S0,id,cat){if(!S0.track)return _refile(S0,id,cat);const t=S0.txns.find(x=>x.id===id);if(!t||t.kind==='fixed'||t.kind==='goal')return;if(t.kind==='unsorted')S0.unsorted=S0.unsorted.filter(x=>x!==id);t.kind='cat';t.ref=cat;S0.memory[t.payee]=cat};
/* the three levels: limit left is always computed from spend */
const limLeft=c=>Math.max(0,c.amt-wkCat(c,0));
/* ---- home ---- */
const _home=SCREENS.home;
const nudge=(k,text,act)=>(S.asked&&S.asked[k]==='no')?'':`<button class="li" data-a="${act}"><span class="d" style="background:${SAVE}"></span><span class="n">${text}</span><span class="t">›</span></button>`;
SCREENS.home=()=>{if(!S.track)return _home();const tot=wkTot(0),prev=wkTot(1);const scale=Math.max(100,Math.ceil(Math.max(tot,prev)/50)*50);const [tc,tv]=topCat(0)||[];
 const parts=S.cats.map((c,i)=>({amt:wkCat(c,0),color:catCol(i)})).filter(p=>p.amt>0);const lines=[];
 if(S.pending.length)lines.push(`<button class="li" data-a="openweek"><span class="d" style="background:var(--amber)"></span><span class="n">Last week is ready</span><span class="t">›</span></button>`);
 if(S.unsorted.length)lines.push(`<button class="li" data-a="push|sort"><span class="d" style="border:1.5px dashed ${AMBER};background:none"></span><span class="n">${S.unsorted.length} payment${S.unsorted.length>1?'s need':' needs'} a place</span><span class="t">›</span></button>`);
 if(tot>0&&!S.cats.some(c=>c.amt))lines.push(nudge('limit','Set a limit for '+esc(tc.name)+'?','askopen|limit'));
 if(!S.balSet)lines.push(nudge('bal','How long will my money last?','askopen|bal'));
 return `<div class="row sp" style="margin-top:2px"><span class="cap">${fmtDay(S.now)}</span><button class="chip" data-a="settings">⚙ Settings</button></div>
 <div class="title" style="margin-top:14px">${tot?'Mostly '+esc(tc.name)+'.':'A fresh week.'}</div><div class="sub" style="margin-top:6px">${tot?'So far this week.':'Your spends will show here.'}</div>
 <div style="margin:22px 8px 8px">${parts.length?multiGrid(parts,scale,{w:300}):gridHtml(0,SPEND,0,0,{w:300})}</div><div style="text-align:center;margin-bottom:14px"><span class="chipscale">1 box ≈ ₹${Math.max(1,Math.round(scale/100))}</span></div>
 <div class="col" style="gap:8px">${lines.join('')}</div>
 <div style="position:sticky;bottom:0;margin-top:24px;padding-top:10px;background:linear-gradient(180deg,transparent,rgba(5,7,11,.9) 40%)"><button class="btn" data-a="pay">${S.p.mode==='manual'?'Add a spend':'Pay'}</button></div>`};
H.askopen=a=>{openAsk(a[0]);return false};
/* ---- spending ---- */
const _spend=SCREENS.spending;
SCREENS.spending=()=>{if(!S.track)return _spend();const rows=S.cats.map((c,i)=>({c,i,v:wkCat(c,0)})).sort((a,b)=>b.v-a.v);const hist=S.txns.slice(0,40);
 return `<div class="sec"><div class="cap">Spending</div><div class="title" style="margin-top:4px">Your week</div>
 <div class="col" style="gap:6px;margin-top:14px">${rows.map(r=>`<button class="li" data-a="push|tcat|${J({id:r.c.id})}"><span class="d" style="background:${boxBg(catCol(r.i))}"></span><span class="n">${esc(r.c.name)}</span><span class="t">${r.c.amt?money(limLeft(r.c))+' left':''}</span><span class="a">${money(r.v)}</span></button>`).join('')}</div>
 <div class="cap" style="margin:22px 0 8px">History</div>${hist.length?`<div class="col" style="gap:6px">${hist.map(t=>`<button class="li" data-a="push|txn|${J({id:t.id})}"><span class="d" style="${t.kind==='unsorted'?`border:1.5px dashed ${AMBER};background:none`:`background:${catColor2(t.ref)}`}"></span><span class="n">${esc(t.payee)}${t.kind==='unsorted'?' <span class="mut" style="font-weight:500">· unsorted</span>':''}</span><span class="t">${fmtDay(new Date(t.t))}</span><span class="a">${money(t.amt)}</span></button>`).join('')}</div>`:`<div class="card sub">Nothing yet. Add a spend to begin.</div>`}</div>`};
SCREENS.tcat=({id})=>{const c=S.cats.find(x=>x.id===id);if(!c)return '';const i=catIdx(id),a=wkCat(c,0),b=wkCat(c,1);const scale=Math.max(100,Math.ceil(Math.max(a,b,c.amt)/50)*50);const list=S.txns.filter(t=>t.ref===id&&t.kind==='cat').slice(0,20);
 return `<button class="back" data-a="back">‹ Spending</button><div class="title">${esc(c.name)}</div><div class="sub" style="margin-top:6px">${a?'This week so far.':'Nothing this week.'}</div>
 <div style="margin:18px 8px 8px">${gridHtml(a/scale*100,catCol(i),0,0,{w:280})}</div><div style="text-align:center;margin-bottom:12px"><span class="chipscale">1 box ≈ ₹${Math.max(1,Math.round(scale/100))}</span></div>
 <div class="card" style="display:grid;gap:10px"><div class="row sp"><span class="mut">This week</span><b>${money(a)}</b></div><div class="row sp"><span class="mut">Last week</span><b>${money(b)}</b></div>${c.amt?`<div class="row sp"><span class="mut">Weekly limit</span><b>${money(c.amt)} · ${money(limLeft(c))} left</b></div>`:''}</div>
 <div class="col" style="gap:8px;margin:14px 0"><button class="btn q" data-a="tlimit|${id}">${c.amt?'Change the limit':'Set a limit?'}</button>${c.amt?`<button class="btn o" data-a="tnolimit|${id}">Remove the limit</button>`:''}</div>
 ${list.length?`<div class="cap" style="margin-bottom:8px">Recent</div><div class="col" style="gap:6px">${list.map(t=>`<button class="li" data-a="push|txn|${J({id:t.id})}"><span class="n">${esc(t.payee)}</span><span class="t">${fmtDay(new Date(t.t))}</span><span class="a">${money(t.amt)}</span></button>`).join('')}</div>`:''}`};
H.tlimit=a=>{UI.popup={id:'ask',k:'limit',cid:a[0],bg:'rgba(5,7,11,.74)'};return true};
H.tnolimit=a=>{const c=S.cats.find(x=>x.id===a[0]);c.amt=0;c.left=0;say('Limit removed.')};
/* ---- tabs that need a plan: invite, never require ---- */
function invite(cap,title,sub,label,k){return `<div class="sec" style="padding-top:40px"><div class="cap">${cap}</div><div class="title" style="margin-top:6px">${title}</div><p class="sub" style="margin:10px 0 22px">${sub}</p><div class="col" style="gap:10px"><button class="btn" data-a="askopen|${k}">${label}</button></div><p class="sm" style="margin-top:14px">You can keep tracking without it.</p></div>`}
const _inc=SCREENS.income,_sav=SCREENS.savings;
SCREENS.income=()=>S.noInc?invite('Money in','No plan yet.','Add what you get each month and Trickle splits it. Only if you want.','Make a plan','plan'):_inc();
SCREENS.savings=()=>(S.track||S.noInc)&&!S.goals.length?invite('Savings','Saving for something?','Name it and pick an amount. Trickle shows how close you are.','Add a goal','goal'):_sav();
/* ---- pay / add a spend while tracking ---- */
const _payF=FLOWS.pay;
FLOWS.pay=F=>{if(!S.track)return _payF(F);const d=F.d;const amt=amtOf(d.kp);const cid=d.cid||(d.target&&d.target.id);const ok=amt>0&&cid;
 return `<div class="mbody"><button class="back" data-a="pclose">‹ Close</button><div class="cap">${S.p.mode==='manual'?'Add a spend':'Pay'}</div><div class="title" style="margin-top:4px">How much?</div><div style="margin:10px 0;display:flex;justify-content:center">${amtDots('₹'+(d.kp||'0'))}</div>${keypad('kp')}<div class="cap" style="margin:14px 0 8px">For what?</div><div class="tgrid">${S.cats.map((c,i)=>`<button class="tile ${cid===c.id?'on':''}" style="${cid===c.id?`border-color:${catCol(i)};background:${catCol(i)}18`:''}" data-a="tpick|${c.id}"><b><i style="background:${boxBg(catCol(i))}"></i>${esc(c.name)}</b></button>`).join('')}</div><div style="height:90px"></div></div><div class="mfoot"><button class="btn ${ok?'':'d'}" data-a="${ok?'tadd':'x'}">${ok?'Add '+money(amt):'Pick an amount and a place'}</button></div>`};
H.tpick=a=>{UI.flow.d.cid=a[0]};
H.tadd=()=>{const d=UI.flow.d;const amt=amtOf(d.kp);const cid=d.cid||(d.target&&d.target.id);doPay(S,{amt,target:{type:'cat',id:cid},payee:d.payee||'Cash',paid:true});const n=labelOf(S,{type:'cat',id:cid});closeFlow();say(money(amt)+' added to '+n+'.');return false};
/* ---- lock needs a PIN ---- */
const _lock=H.lock;H.lock=()=>{if(!APP_PIN){say('No PIN yet. Add one in Settings.');return false}return _lock()};

/* ===== control panel ===== */
function loadProfile(k){S=newState(k);S.moneyIn=[{id:'m0',t:new Date(2026,9,1,9,0).getTime(),label:'Allowance',amt:S.p.income,note:''}];resetUI();window._celeLock=false;render();fitPhone()}
function ev(name,fn){return {name,fn}}
const EVENTS=()=>{const c0=S.cats[0],big=S.cats.find(c=>c.name==='Outings')||S.cats[S.cats.length-1];const upi=S.p.mode==='upi';const g0=S.goals.find(g=>g.state==='active');const m0=S.memoryPick;return [
 {h:'Time',items:[
  ['+1 day',()=>{advanceDays(S,1);say('One day later.');maybeWeek()}],
  ['+3 days',()=>{advanceDays(S,3);say('Three days later.');maybeWeek()}],
  ['Sunday 8 pm: week-end pop-up',()=>{const sun=new Date(startOfWeek(S.now).getTime()+6*DAY+20*36e5);if(S.now<sun)S.now=sun;openWeekPop();UI.flow=null;UI.sheet=null}],
  ['New week starts (Monday)',()=>{const n=nextMonday(S.now);const days=Math.round((n-S.now)/DAY);advanceDays(S,Math.max(1,days));say('A new week began.');maybeWeek()}]]},
 {h:'Payments seen on your link',items:[
  [upi?'Known place: ₹60 at '+(S.txns.find(t=>t.kind==='cat')?.payee||'Tea Stall'):'(manual mode: nothing is seen)',()=>{if(!upi)return say('You track by hand, so Trickle sees nothing. Use Pay → Add a spend.');const t=S.txns.find(x=>x.kind==='cat');if(!t)return say('No known places yet.');S.memory[t.payee]=S.memory[t.payee]||t.ref;detectPayment(S,t.payee,60);say(`Seen: ₹60 at ${t.payee}, filed automatically.`)}],
  ['New place: ₹450 at Mystery Cafe',()=>{if(!upi)return say('You track by hand, so Trickle sees nothing.');detectPayment(S,'Mystery Cafe',450);say('A payment needs a category.')}],
  ['New place: ₹180 at Blue Tokai',()=>{if(!upi)return say('You track by hand, so Trickle sees nothing.');detectPayment(S,'Blue Tokai',180);say('A payment needs a category.')}]]},
 {h:'Spending',items:[
  ['Small spend: ₹60 in '+c0.name,()=>{doPay(S,{amt:60,target:{type:'cat',id:c0.id},payee:'Quick spend'});say('₹60 spent.')}],
  ['Over budget: ₹312 in '+big.name+' (buffer, others)',()=>{doPay(S,{amt:312,target:{type:'cat',id:big.id},payee:'Big night'});say('Over the category: the cascade ran.')}],
  ['Big overspend: ₹'+Math.round(S.flexW*.9)+' in '+big.name+' (reaches savings)',()=>{doPay(S,{amt:Math.round(S.flexW*.9),target:{type:'cat',id:big.id},payee:'Big night'});say('Savings were touched.')}],
  ['Use up the week (all categories to 0)',()=>{S.cats.forEach(c=>c.left=0);S.bufLeft=0;say('Nothing left this week.')}]]},
 {h:'Money in',items:[
  ['A ₹'+S.p.income.toLocaleString('en-IN')+' credit arrives (unsorted)',()=>{addCredit(S,'Allowance transfer',S.p.income);say('A credit is waiting in Income.')}],
  ['A friend repays ₹200 (unsorted)',()=>{addCredit(S,'Rahul',200);say('A credit is waiting in Income.')}]]},
 {h:'Bills',items:[
  ['A bill is due tomorrow',()=>{const b=S.bills[0];if(!b)return say('This profile has no fixed bills.');b.nextDue=new Date(S.now.getTime()+DAY);b.dueNow=false;say(b.name+' is due tomorrow.')}],
  ['A bill is due now (unpaid)',()=>{const b=S.bills[0];if(!b)return say('This profile has no fixed bills.');b.dueNow=true;b.nextDue=new Date(S.now);say(b.name+' is due.')}]]},
 {h:'Budget and lock',items:[
  ['Offer: fit budget to real weeks',()=>{UI.sheet={id:'refit',p:{}}}],
  ['Lock the app',()=>{H.lock()}]]},
 {h:'Pop-ups (always skippable)',items:[['Link UPI?',()=>openAsk('link')],['Add a spend?',()=>openAsk('add')],['Payments need a place',()=>openAsk('sort')],['Set a limit?',()=>openAsk('limit')],['Balance?',()=>openAsk('bal')],['Full plan?',()=>openAsk('plan')],['Add a goal?',()=>openAsk('goal')],['Remind about bills?',()=>openAsk('notif')],['Add a PIN?',()=>openAsk('pin')],['Bring in older spends?',()=>openAsk('import')],['Last week recap (no budget)',()=>openAsk('recap')]]},
 {h:'Goals',items:[
  ['A goal reaches its target',()=>{if(!g0)return say('No active goal.');g0.saved=g0.target;g0.hist[11]=(g0.hist[11]||0)+Math.max(0,g0.target-g0.saved);reachedCheck(S);logE(S,g0.name+' reached its target')}],
  ['Add ₹500 to a goal',()=>{if(!g0)return say('No active goal.');g0.saved=Math.min(g0.target,g0.saved+500);g0.hist[11]=(g0.hist[11]||0)+500;reachedCheck(S);say('₹500 added to '+g0.name+'.')}]]}
]};
function maybeWeek(){if(S.pending.length){openWeekPop()}}
const FLAGS=[['bankDecline','Bank declines the next payment'],['bankSlow','Bank is slow (waiting state)'],['lowBalance','Account balance is low'],['linkLost','UPI link needs a refresh']];
function renderPanel(){const el=$('#panel');if(!el||!S)return;const sp=spentThisWeek(S);
 const potRows=[['Money left this week',money(flexLeft(S))+' of '+money(S.flexW)],['Buffer left',money(S.bufLeft)+' of '+money(S.bufAmt)],['Spent this week',money(sp)],['Fixed reserve',money(S.bills.reduce((a,b)=>a+b.reserve,0))],['Goals saved',money(S.goals.filter(g=>g.state!=='done').reduce((a,g)=>a+g.saved,0))],['Free savings',money(S.free)],['Unsorted payments',String(S.unsorted.length)],['Unsorted credits',String(S.credits.length)]];
 const flexSum=S.cats.reduce((a,c)=>a+c.amt,0)+S.bufAmt;const okInv=flexSum===S.flexW;
 el.innerHTML=`<div class="pc" style="background:linear-gradient(135deg,#12261f,#0c1017)"><div style="font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1">Trickle mockup</div><div class="sm" style="margin-top:6px">Everything in the phone is computed from a live ledger. Pick a profile, tap around, then use <b>Simulate</b> to make things happen: a payment on your link, a credit, a bill, the week ending, a goal reached, a bank that declines. The <b>Ledger</b> shows where every rupee is.</div></div><div class="pc"><h3>Start</h3><button class="prof" data-ob="1"><b>Replay onboarding</b><span>Every step has a Skip. Or tap Just start tracking</span></button></div><div class="pc"><h3>Or jump to a profile</h3><div class="col" style="gap:6px">${Object.values(PROFILES).map(p=>`<button class="prof ${S.key===p.key?'on':''}" data-p="${p.key}"><b>${p.name}</b><span>${p.blurb}</span></button>`).join('')}</div></div>
 <div class="pc"><h3>Simulate</h3>${EVENTS().map((g,gi)=>`<div class="cap" style="margin:${gi?12:0}px 0 6px">${g.h}</div><div class="pgrid">${g.items.map((it,i)=>`<button class="pbtn" data-e="${gi}|${i}">${esc(it[0])}</button>`).join('')}</div>`).join('')}
  <div class="cap" style="margin:12px 0 6px">Switches</div><div class="pgrid">${FLAGS.map(f=>`<button class="pbtn ${S.flags[f[0]]?'on':''}" data-f="${f[0]}">${S.flags[f[0]]?'● ':'○ '}${f[1]}</button>`).join('')}</div></div>
 <div class="pc"><h3>Ledger</h3><div class="pot">${potRows.map(r=>`<span>${r[0]}</span><b>${r[1]}</b>`).join('')}<span>Categories + buffer = week</span><b style="color:${okInv?'#62DCB4':'#E3A43F'}">${okInv?'balanced ✓':'check'}</b></div></div>
 <div class="pc"><h3>What just happened</h3><div class="log">${S.log.slice(0,10).map(l=>`<div><span class="mut">${l.t.toLocaleDateString('en-IN',{weekday:'short'})} ${fmtTime(l.t)}</span> · ${esc(l.text)}</div>`).join('')||'<span class="mut">Nothing yet. Try a simulation.</span>'}</div></div>
 <div class="pc"><h3>Not in this mockup</h3><div class="sm">Everything is here now: onboarding, pay, move money, week-end, goals, settings and lock. First week is not prorated yet. The blueprint lists every screen: <a style="color:#8CF3CE" href="https://claude.ai/artifact/RVjueXaXCsmCKyF6UUEErj" target="_blank" rel="noopener">blueprint ↗</a>. Look and tokens: <a style="color:#8CF3CE" href="https://claude.ai/artifact/3vrR99iZ8rmzw51MeFRXde" target="_blank" rel="noopener">design system ↗</a>.</div></div>`}
document.addEventListener('click',e=>{const ob=e.target.closest('[data-ob]');if(ob){startOnb();return}const p=e.target.closest('[data-p]');if(p){loadProfile(p.dataset.p);return}const v=e.target.closest('[data-e]');if(v){const [g,i]=v.dataset.e.split('|').map(Number);EVENTS()[g].items[i][1]();render();return}const f=e.target.closest('[data-f]');if(f){S.flags[f.dataset.f]=!S.flags[f.dataset.f];if(f.dataset.f==='linkLost'&&S.flags.linkLost)say('The link needs a refresh.');render()}});
startOnb();
