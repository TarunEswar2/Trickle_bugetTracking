<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --stage:#050505;--ink:#0d0d0e;--surface:#17181a;--surface2:#212226;--surface3:#2a2b30;

  --good:#0ca30c;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;

}
html,body{background:var(--stage);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;font-size:14px;line-height:1.4}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 0 40px;gap:12px}
.stage-head{width:412px;max-width:calc(100% - 32px);display:flex;align-items:center;justify-content:space-between;color:var(--text2);font-size:12px}

.stage-btn{border:1px solid var(--border2);background:var(--surface);color:var(--text);font:inherit;font-size:11px;padding:5px 11px;border-radius:20px;cursor:pointer}
.phone{position:relative;width:412px;max-width:100%;height:880px;background:var(--ink);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(255,255,255,.06)}

.statusbar{flex:none;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:11px;color:var(--text2)}
.viewport{position:relative;flex:1;overflow:hidden}
.frame{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding-bottom:24px;background:var(--ink)}
.frame.active{display:block}
.frame::-webkit-scrollbar{width:0}
body.with-nav .frame{padding-bottom:100px}
.tabbar{position:absolute;left:12px;right:12px;bottom:10px;height:72px;background:var(--surface);border:1px solid var(--border);border-radius:22px;display:none;align-items:flex-end;justify-content:space-around;padding:0 6px 9px;z-index:40;box-shadow:0 8px 28px rgba(0,0,0,.5)}
body.with-nav .tabbar{display:flex}
.tab{flex:1;background:none;border:none;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text3)}
.tab span{font-size:10px}.tab svg{width:24px;height:24px}
.tab.on{color:var(--text)}
.home-cradle{width:52px;height:52px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;margin-top:-20px;border:1px solid var(--border2)}
.tab.on .home-cradle{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pad{padding:0 16px}
.stack>*+*{margin-top:12px}
.topbar{display:flex;align-items:center;gap:6px;padding:6px 10px 4px;min-height:48px}
.topbar h1{font-size:22px;font-weight:650;letter-spacing:-.2px}
.back{width:40px;height:40px;border:none;background:none;color:var(--text);cursor:pointer;font-size:18px;flex:none}
.h1{font-size:22px;font-weight:650;letter-spacing:-.2px}
.h2{font-size:16px;font-weight:600;line-height:1.3}
.kick{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.body2{font-size:14px;color:var(--text2)}
.foot{font-size:11px;color:var(--text3);margin-top:8px;font-variant-numeric:tabular-nums}
.hero{font-size:34px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:proportional-nums}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;position:relative}
.card.lift{background:var(--surface2)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;cursor:default}
.card-h.link{cursor:pointer}
.card-h .chev{color:var(--text3);font-size:16px;flex:none}
.sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin:22px 16px 10px}
.field{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;height:48px;padding:0 14px;font:inherit;font-size:15px;color:var(--text);display:flex;align-items:center}
.field::placeholder{color:var(--text3)}
.field:focus{outline:2px solid var(--accent);outline-offset:1px}
.field.sm{height:34px;font-size:13px;border-radius:10px;padding:0 10px}
.frow{position:relative;display:flex;gap:8px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border:none;border-radius:14px;background:var(--accent);color:var(--on-accent);font:inherit;font-size:16px;font-weight:650;cursor:pointer}
.btn.sec2{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--border2);height:46px;font-size:14px}
.btn.sm{height:36px;width:auto;padding:0 14px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:6px 11px;font:inherit;font-size:12px;color:var(--text);cursor:pointer;white-space:nowrap}
.pill.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pill .sw{width:9px;height:9px;border-radius:3px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:none;color:var(--text2);font:inherit;font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);width:100%;background:none;border-left:none;border-right:none;border-top:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row:last-child{border-bottom:none}
.row .m{flex:1;min-width:0}
.row .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:11px;color:var(--text3)}
.row .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.badge{font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--surface3);color:var(--text2);letter-spacing:.03em}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:none}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface2);border-radius:12px;padding:10px;border:1px solid var(--border);cursor:pointer;text-align:left;color:inherit;font:inherit;min-width:0}
.tile .kick{font-size:10px}
.tile .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text)}
.status i{font-style:normal;font-size:12px}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--surface3);border:1px solid var(--border2);position:relative;cursor:pointer;flex:none}
.toggle i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text3);transition:left .15s}
.toggle.on{background:var(--accent)}.toggle.on i{left:21px;background:var(--on-accent)}
.err{font-size:12px;color:var(--serious);display:none;margin-top:6px}.err.show{display:block}
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible;max-width:100%}
.chart text{font-family:inherit}
.chart.dim [data-g]:not(.on){opacity:.35}
.chart [data-t]{cursor:pointer}
.tip{position:absolute;z-index:80;background:var(--surface3);border:1px solid var(--border2);color:var(--text);font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;padding:6px 9px;border-radius:8px;pointer-events:none;max-width:250px;box-shadow:0 6px 18px rgba(0,0,0,.5);display:none;line-height:1.35}
.tip b{font-weight:650}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600;padding:9px 14px;border-radius:12px;z-index:90;display:none;white-space:nowrap}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:flex-end}
.scrim.show{display:flex}
.sheet{width:100%;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--border2);padding:10px 16px 22px;max-height:88%;overflow-y:auto;overflow-x:hidden}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--surface3);margin:0 auto 12px}
.sheet h3{font-size:18px;font-weight:650;margin-bottom:12px}
.onb{padding:8px 16px 20px}
.stepbar{display:flex;align-items:center;gap:10px;padding:10px 0 12px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.keypad button{height:52px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font:inherit;font-size:20px;cursor:pointer}
.pinrow{display:flex;gap:18px;justify-content:center;transition:transform .2s}
.pinrow i{width:16px;height:16px;border-radius:50%;border:2px solid var(--text3)}
.pinrow i.f{background:var(--text2);border-color:var(--text2)}
.pinrow.match i{background:var(--accent);border-color:var(--accent)}
.pinrow.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.slider{width:100%;accent-color:var(--accent)}
input[type=range]{height:22px}
.lane{border:1px solid var(--border2);border-radius:14px;padding:12px;background:var(--surface);cursor:pointer;transition:opacity .2s;display:block;width:100%;color:inherit;font:inherit;text-align:left}
.lane.sel{border-color:var(--accent);background:var(--surface2)}
.lane.dimmed{opacity:.45}
.scanbox{width:230px;height:230px;margin:10px auto;border-radius:18px;border:2px dashed var(--border2);position:relative;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.grow{animation:grow .6s ease-out}
@keyframes grow{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hdr-home{display:flex;align-items:center;gap:10px;padding:8px 16px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.search{flex:1;height:40px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--text3);font:inherit;font-size:13px;text-align:left;padding:0 14px;cursor:pointer}
.paytiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paytile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text);font:inherit;font-size:12px;cursor:pointer}
.paytile.off{opacity:.35}
/* ================= v7 overrides ================= */
:root{--stage:#050505;--ink:#0B0B0C;--surface:#141414;--surface2:#1D1E20;--surface3:#27282B;--border:#222;--border2:rgba(255,255,255,.14);
 --text:#F4F4F2;--text2:#A9AAAD;--text3:#74757A;--accent:#C6F432;--lime:#C6F432;--on-accent:#0B0B0C;--ghost:rgba(198,244,50,.12);
 --lime-grad:linear-gradient(135deg,#C6F432 0%,#8FD14F 55%,#2E6B3A 100%);--pa:#c98500;--pb:#3987e5;--ps:#199e70;color-scheme:dark}

function glyph(kind,ic){var k=KIND[kind]||{c:'var(--surface3)',i:ic||'other'};var dash=k.c==='dash';return '<span class="qglyph" style="'+(dash?'border:1.5px dashed var(--text2);background:none':'background:'+k.c)+'">'+icon(ic||k.i,18,dash?'var(--text)':'#0B0B0C')+'</span>';}
var GUESS={'PAYTM*QR7731':['Snacks','Food','Transport']};
function dueSubs(days){var out=[];SUBS.forEach(function(s){var d=nextDue(s,TODAY);if(d&&dayStart(d)-TODAY<=days*DAY)out.push({s:s,due:d});});return out;}
function overCats(){var p=POOLS(),o=[];CATS.forEach(function(c){var v=p.b[c.name]||0;if(v<-.5)o.push({cat:c.name,need:Math.round(-v)});});return o;}
function inboxAll(){var items=[],p=POOLS();
 TX.forEach(function(t){if(t.type==='income'&&t.unassigned>0)items.push({id:'inc:'+t.id,kind:'income_assign',pri:1,ref:t.id,title:money(t.unassigned)+' from '+t.incomeCat+(t.from?' ('+t.from+')':'')+' is waiting',sub:'Arrived '+fmtDay(t.ts).toLowerCase()+' · sitting in To assign',btn:'Assign by rule',one:'assignByRule(\''+t.id+'\')',flow:'openAssign(\''+t.id+'\')'});});
 overCats().forEach(function(o){if(S.ackOver[o.cat])return;var ok=p.ta>=o.need;items.push({id:'over:'+o.cat,kind:'overspend_carry',pri:2,ref:o.cat,title:o.cat+' went '+money(o.need)+' over: carried to Oct',sub:'Cover it now, or Oct’s budget starts '+money(o.need)+' lower',btn:ok?'Cover from To assign':'Choose cover',one:ok?'coverAfter(\''+q(o.cat)+'\',\'to_assign\')':'openOverspend(\''+q(o.cat)+'\')',flow:'openOverspend(\''+q(o.cat)+'\')'});});
 TX.forEach(function(t){if(t.type==='spend'&&t.split&&t.split.status==='pending_setup'){var ppl=defaultPeople();items.push({id:'split:'+t.id,kind:'split_settle',pri:3,ref:t.id,title:'Split '+money(t.amt)+' at '+t.merchant+': who owes you?',sub:fmtDay(t.ts)+' · paid from '+t.cat,btn:'Split equally ('+(ppl.length+1)+')',one:'splitEqualNow(\''+t.id+'\')',flow:'openSettle(\''+t.id+'\')'});}});
 S.sweeps.forEach(function(sw){if(sw.resolved)return;items.push({id:'sweep:'+sw.id,kind:'sweep',pri:3,ref:sw.id,title:'Sweep '+money(sw.amt)+' leftover from '+sw.period,sub:'Saved from budget · waiting in To assign',btn:'Move to '+defaultGoal().name,one:'sweepTo(\''+sw.id+'\',\''+defaultGoal().id+'\')',flow:'openSweep(\''+sw.id+'\')'});});
 dueSubs(3).forEach(function(d){var key=d.s.id+':'+d.due;if(S.subMarked[key])return;items.push({id:'sub:'+key,kind:'sub_due',pri:4,ref:d.s.id,icon:d.s.icon,title:d.s.name+' '+money(d.s.amt)+' due '+DOW[new Date(d.due).getDay()]+' '+fmtD(d.due),sub:'Autopay from '+d.s.cat+' · '+Math.round((dayStart(d.due)-TODAY)/DAY)+' days',btn:'Looks right',one:'subLooksRight(\''+d.s.id+'\')',flow:'S.selSub=\''+d.s.id+'\';go(\'subDue\')'});});
 TX.forEach(function(t){if(t.type==='spend'&&!t.cat){var g=(GUESS[t.merchant]||[CATS[0].name])[0];items.push({id:'cat:'+t.id,kind:'uncategorised',pri:5,ref:t.id,title:money(t.amt)+' to ‘'+t.merchant+'’: pick a category',sub:fmtDay(t.ts)+', '+fmtT(t.ts)+' · UPI · '+(t.account||''),btn:g,one:'setCat(\''+t.id+'\',\''+q(g)+'\')',flow:'S.selTxn=\''+t.id+'\';go(\'categorise\')'});}});
 return items.sort(function(a,b){return a.pri-b.pri;});}
function inbox(){return inboxAll().filter(function(i){return !S.snooze[i.id];});}
function badgeCount(){return inbox().length;}
function updateBadge(){var b=$('abadge');if(!b)return;var n=badgeCount();b.textContent=n>9?'9+':n;b.style.display=n?'block':'none';}
function defaultPeople(){return ['Arjun','Meera','Kabir'];}
function defaultGoal(){var G=GOALS.length?GOALS:GOAL_SEED;return G.filter(function(g){return g.isDefaultSweep;})[0]||G[0];}
function inboxCard(it){return '<div class="inbox" data-inbox="'+esc(it.id)+'">'+glyph(it.kind,it.icon)+'<div class="m"><div class="t">'+esc(it.title)+'</div><div class="s">'+esc(it.sub)+'</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><button class="lbtn" onclick="'+it.one+'">'+esc(it.btn)+'</button><div style="display:flex;gap:2px"><button class="dots3" style="height:24px;font-size:11px;width:auto;padding:0 4px" aria-label="Snooze until tomorrow" onclick="openSheet(\'snooze\',\''+q(it.id)+'\')">Later</button><button class="dots3" style="height:24px" aria-label="More options" onclick="'+it.flow+'">…</button></div></div></div>';}
function snooze(id){S.snooze[id]=1;toast('Snoozed until tomorrow');rerender();}

FR.actions=function(el){var items=inbox(),sn=inboxAll().length-items.length;
 el.innerHTML=topbar('Actions')+'<div class="pad"><div class="addgrid">'
 +[['logSpend','edit','Log spend','Cash or anything not on UPI'],['addIncome','down','Add income','Allowance, shifts, gifts'],['moveMoney','swap','Move money','Between pools, categories, goals'],['importExcel','file','Import Excel','Coming soon']].map(function(a){return '<button class="addtile" onclick="startAdd(\''+a[0]+'\')"><span class="qglyph" style="background:var(--surface2)">'+icon(a[1],20,'var(--lime)')+'</span><span>'+a[2]+'<div class="s">'+a[3]+'</div></span></button>';}).join('')+'</div>'
 +'<div class="between" style="margin:22px 0 10px"><div class="h2">To do · '+items.length+'</div><div class="chips"><button class="pill '+(S.showDone?'':'on')+'" onclick="S.showDone=false;rerender()">Open</button><button class="pill '+(S.showDone?'on':'')+'" onclick="S.showDone=true;rerender()">Done ('+S.done.length+')</button></div></div>'
 +(S.showDone?S.done.map(function(d){return '<div class="inbox" style="opacity:.7">'+'<span class="qglyph" style="background:var(--surface2)">'+icon('check',18,'var(--good)')+'</span><div class="m"><div class="t" style="font-weight:500">'+esc(d.title)+'</div><div class="s">'+fmtDay(d.ts)+'</div></div></div>';}).join('')
  :(items.length?items.map(inboxCard).join(''):'<div class="card" style="text-align:center;padding:26px">'+icon('check',28,'var(--lime)')+'<div class="h2" style="margin-top:8px">Nothing needs you</div><div class="foot">New income, splits and overspends show up here.</div></div>')
  +(sn?'<button class="pill" style="margin-top:4px" onclick="S.snooze={};rerender()">Show '+sn+' snoozed</button>':''))+'</div>';};
function startAdd(f){S.pending=null;S.flow=null;if(f==='logSpend')S.pending={type:'manual',to:'',amt:0,cat:CATS[0].name,note:'',split:{on:false,people:[],mode:S.splitMode,shares:{},later:false},source:'Manual'};go(f);}

/* ---------- assign income ---------- */
function goalsActive(){return GOALS.filter(function(g){return !g.reachedTs;});}
function ruleAlloc(amt){var b=Math.round(amt*S.ruleB/100),s=amt-b,g=Math.round(s*2/3);return {budget:b,goals:{goa:g,moto:s-g,general:0},fill:false};}
function assignable(t){return Math.max(0,Math.min(t.unassigned,Math.floor(POOLS().ta)));}
function openAssign(id){var t=txById(id);S.flow={inc:id,amt:t.unassigned,a:ruleAlloc(assignable(t))};go('assignIncome');}
function assignDst(a){var dst=[];var b=a.budget;
 if(a.fill&&b>0){overCats().forEach(function(o){var x=Math.min(b,o.need);if(x>0){dst.push({ref:'budget:'+o.cat,amt:x});b-=x;}});}
 if(b>0)splitBudget(b).forEach(function(x){if(cat(x.ref.slice(7)))dst.push(x);else dst.push({ref:'budget:'+CATS[0].name,amt:x.amt});});
 Object.keys(a.goals).forEach(function(g){if(a.goals[g]>0)dst.push({ref:'goal:'+g,amt:a.goals[g]});});
 var m={};dst.forEach(function(x){m[x.ref]=(m[x.ref]||0)+x.amt;});return Object.keys(m).map(function(k){return {ref:k,amt:m[k]};});}
function allocTotal(a){return a.budget+sumObj(a.goals);}
function doAssign(id,a,label){var t=txById(id),tot=allocTotal(a);if(tot>assignable(t)+.5){toast('Only '+money(assignable(t))+' of this income is still in To assign');return false;}if(tot<=0){toast('Enter an amount');return false;}
 return commit('Assigned '+money(tot)+' from '+t.incomeCat,function(){var dst=assignDst(a);transfer([{ref:'to_assign',amt:tot}],dst,'assign',{incomeId:id,rule:label});t.unassigned=Math.max(0,t.unassigned-tot);},{done:'Assigned '+money(tot)+' from '+t.incomeCat});}
function assignByRule(id){var t=txById(id);if(!assignable(t)){toast('To assign is empty: covers already used this money');return;}if(doAssign(id,ruleAlloc(assignable(t)),S.ruleB+'/'+(100-S.ruleB)))rerender();}
function setAlloc(k,v){v=Math.max(0,Math.round(+v||0));if(k==='budget')S.flow.a.budget=v;else S.flow.a.goals[k]=v;paintAssign();}
function paintAssign(){var f=S.flow,t=txById(f.inc),tot=allocTotal(f.a),left=assignable(t)-tot;
 $('as-bar').innerHTML=poolBar([{label:'Budget',val:f.a.budget,color:'var(--pb)'},{label:'Goals',val:sumObj(f.a.goals),color:'var(--ps)'},{label:'Leave in To assign',val:Math.max(0,left),color:'var(--pa)'}],{h:18,labels:true});
 $('as-left').innerHTML=left<0?'<span class="redt">▲ '+money(-left)+' more than arrived</span>':'Leave in To assign: <b>'+money(left)+'</b>';$('as-cta').textContent='Assign '+money(tot);$('as-cta').disabled=left<0||tot<=0;}
FR.assignIncome=function(el){var f=S.flow;if(!f||!txById(f.inc)){var i=TX.filter(function(t){return t.unassigned>0;})[0];if(!i){el.innerHTML=subbar('Assign income')+'<div class="pad"><div class="card">Nothing waiting in To assign from income.</div></div>';return;}openAssign(i.id);return;}
 var t=txById(f.inc),a=f.a;
 el.innerHTML=subbar('Assign income')+'<div class="pad"><div class="card" style="text-align:center"><div class="kick">'+esc(t.incomeCat)+' · '+esc(t.from||'')+'</div><div class="amtbig" style="margin:6px 0">'+money(t.unassigned)+'</div><div class="foot">'+fmtDay(t.ts)+' · waiting in To assign'+(assignable(t)<t.unassigned?' · only '+money(assignable(t))+' left after covers':'')+'</div></div>'
 +'<div class="chips" style="margin-bottom:12px"><button class="pill on" onclick="S.flow.a=ruleAlloc(assignable(txById(S.flow.inc)));rerender()">'+icon('rule',14)+' '+S.ruleB+'/'+(100-S.ruleB)+' rule</button><button class="pill" onclick="S.flow.a=ruleAlloc(assignable(txById(S.flow.inc)));toast(\'Same split as your last Part-time\');rerender()">Assign like last period</button><button class="pill '+(a.fill?'on':'')+'" onclick="S.flow.a.fill=!S.flow.a.fill;rerender()">Fill underfunded first</button></div>'
 +'<div class="card"><div id="as-bar"></div><div class="foot" id="as-left"></div>'
 +'<div class="sharerow"><span class="dot" style="background:var(--pb);border-radius:2px"></span><div style="flex:1"><div>Budget</div><div class="foot" style="margin:0">'+(a.fill&&overCats().length?'Fills '+overCats().map(function(o){return o.cat+' '+money(o.need);}).join(', ')+' first, then spreads':'Spread across categories by your weights')+'</div></div><input class="field sm" type="number" id="as-budget" value="'+a.budget+'" oninput="setAlloc(\'budget\',this.value)" aria-label="Budget amount"></div>'
 +goalsActive().map(function(g){return '<div class="sharerow"><span class="dot" style="background:var(--ps);border-radius:2px"></span><div style="flex:1">'+esc(g.name)+'<div class="foot" style="margin:0">'+(g.target?goalPct(g)+'% of '+money(g.target):money(goalSaved(g))+' saved')+'</div></div><input class="field sm" type="number" value="'+(a.goals[g.id]||0)+'" oninput="setAlloc(\''+g.id+'\',this.value)" aria-label="'+esc(g.name)+' amount"></div>';}).join('')+'</div>'
 +'<button class="btn" id="as-cta" onclick="if(doAssign(\''+t.id+'\',S.flow.a,\'custom\'))go(\'actions\')">Assign</button></div>';paintAssign();};

/* ---------- settle split ---------- */
function openSettle(id){var t=txById(id);S.flow={spend:id,people:defaultPeople().slice(),mode:S.splitMode,shares:{}};eqShares();go('settleSplit');}
function eqShares(){var f=S.flow,t=txById(f.spend),n=f.people.length+1,each=Math.floor(t.amt/n);f.shares={};f.people.forEach(function(p){f.shares[p]=each;});f.shares.You=t.amt-each*f.people.length;}
function togglePerson(p){var f=S.flow,i=f.people.indexOf(p);if(i>=0)f.people.splice(i,1);else f.people.push(p);if(f.mode==='equal')eqShares();else{if(i>=0)delete f.shares[p];else f.shares[p]=0;}rerender();}
function setShare(p,v){S.flow.shares[p]=Math.max(0,Math.round(+v||0));paintShares();}
function shareGap(){var f=S.flow,t=txById(f.spend);return t.amt-['You'].concat(f.people).reduce(function(a,p){return a+(f.shares[p]||0);},0);}
function paintShares(){var g=shareGap(),e=$('sh-gap');if(e)e.innerHTML=g===0?'<span class="status"><i style="color:var(--good)">✓</i>Shares add up to '+money(txById(S.flow.spend).amt)+'</span>':'<span class="badge" style="background:rgba(208,59,59,.2);color:#ff9b8f">▲ '+money(Math.abs(g))+(g>0?' unassigned':' too much')+'</span>';var b=$('sh-save');if(b)b.disabled=g!==0||!S.flow.people.length;var o=$('sh-owed');if(o)o.textContent=money(S.flow.people.reduce(function(a,p){return a+(S.flow.shares[p]||0);},0));}
function saveSplit(id,people,shares,mode){var t=txById(id);
 return commit('Split saved · '+money(people.reduce(function(a,p){return a+shares[p];},0))+' owed to you',function(){
  t.split={status:'open',mode:mode,shares:['You'].concat(people).map(function(p){return {person:p,amt:shares[p]||0};})};
  t.split.shares.forEach(function(s){if(s.person==='You'||!s.amt)return;var iou={id:nid('i'),person:s.person,amt:s.amt,spendTxnId:t.id,createdTs:NOW};IOUS.push(iou);s.iouId=iou.id;});},{done:'Split '+t.merchant+' '+money(t.amt)});}
function splitEqualNow(id){S.flow={spend:id,people:defaultPeople().slice(),mode:'equal'};eqShares();if(saveSplit(id,S.flow.people,S.flow.shares,'equal'))rerender();}
FR.settleSplit=function(el){var f=S.flow;if(!f||!f.spend){var p=TX.filter(function(t){return t.split&&t.split.status==='pending_setup';})[0];if(!p){el.innerHTML=subbar('Settle split')+'<div class="pad"><div class="card">No splits waiting.</div></div>';return;}openSettle(p.id);return;}
 var t=txById(f.spend),pool=FRIENDS.concat(f.people.filter(function(p){return FRIENDS.indexOf(p)<0;}));
 el.innerHTML=subbar('Settle split')+'<div class="pad"><div class="card"><div class="between"><div style="display:flex;gap:10px;align-items:center">'+glyph('split_settle')+'<div><div class="h2">'+esc(t.merchant)+'</div><div class="foot" style="margin:0">'+fmtDay(t.ts)+', '+fmtT(t.ts)+' · from '+esc(t.cat)+'</div></div></div><div class="h2 num">'+money(t.amt)+'</div></div><div class="foot">The full '+money(t.amt)+' already left '+esc(t.cat)+'. Friends’ shares become Owed to you, outside your balance.</div></div>'
 +'<div class="kick" style="margin:4px 0 8px">Who was there? · contacts and recent split partners</div><div class="chips">'+pool.map(function(p){var on=f.people.indexOf(p)>=0;return '<button class="person '+(on?'on':'')+'" onclick="togglePerson(\''+q(p)+'\')"><span class="pa">'+p[0]+'</span>'+esc(p)+(on?' ✓':'')+'</button>';}).join('')+'<button class="person" onclick="openSheet(\'peoplePicker\')"><span class="pa">+</span>Someone else</button></div>'
 +'<div style="margin:14px 0 8px" class="segw"><button class="'+(f.mode==='equal'?'on':'')+'" onclick="S.flow.mode=\'equal\';eqShares();rerender()">Equal</button><button class="'+(f.mode==='custom'?'on':'')+'" onclick="S.flow.mode=\'custom\';rerender()">Custom</button></div>'
 +'<div class="card">'+['You'].concat(f.people).map(function(p){return '<div class="sharerow"><span class="pa person" style="padding:0;border:none"><span class="pa">'+p[0]+'</span></span><div style="flex:1">'+esc(p)+(p==='You'?' <span class="foot">(your share stays spent)</span>':'')+'</div>'+(f.mode==='equal'?'<b class="num">'+money(f.shares[p]||0)+'</b>':'<input class="field sm" type="number" value="'+(f.shares[p]||0)+'" oninput="setShare(\''+q(p)+'\',this.value)" aria-label="'+esc(p)+' share">')+'</div>';}).join('')
 +'<div style="margin-top:10px" id="sh-gap"></div></div>'
 +'<div class="between" style="margin:4px 0 12px"><span class="body2">Owed to you after saving</span><b id="sh-owed" class="num"></b></div>'
 +'<button class="btn" id="sh-save" onclick="if(saveSplit(\''+t.id+'\',S.flow.people,S.flow.shares,S.flow.mode))go(\'actions\')">Save split</button></div>';paintShares();};

/* ---------- overspend cover (shared by pay, log spend and the after-the-fact inbox item) ---------- */
function goalPace(g){var a=NOW-90*DAY,s=0;TX.forEach(function(t){if(t.type==='transfer'&&t.ts>=a)t.dst.forEach(function(x){if(x.ref==='goal:'+g.id)s+=x.amt;});});return s/90;}
function goalSaved(g){return POOLS().g[g.id]||0;}
function goalPct(g){return g.target?Math.round(goalSaved(g)/g.target*100):0;}
function goalEta(g,delta){var need=g.target-goalSaved(g)+(delta||0),pace=goalPace(g);if(need<=0)return NOW;return pace>0?NOW+need/pace*DAY:null;}
function coverOptions(c,need){var p=POOLS(),o=[];
 o.push({k:'to_assign',ok:p.ta>=need,t:'To assign',have:p.ta,s:'To assign '+money(p.ta)+' → '+money(p.ta-need)});
 var cs=CATS.filter(function(x){return x.name!==c&&(p.b[x.name]||0)>0;}).sort(function(a,b){return (p.b[b.name]||0)-(p.b[a.name]||0);});
 o.push({k:'cat',ok:cs.length&&(p.b[cs[0].name]||0)>=need,t:'Another category’s leftover',cats:cs});
 var gs=GOALS.filter(function(g){return !g.reachedTs&&(p.g[g.id]||0)>0;});o.push({k:'goal',ok:gs.some(function(g){return p.g[g.id]>=need;}),t:'A savings goal',goals:gs});
 o.push({k:'letgo',ok:true,t:'Let it go over'});return o;}
function coverBody(c,need,ctx){var o=coverOptions(c,need),p=POOLS(),sel=ctx.sel;if(!sel){var f=o.filter(function(x){return x.ok;})[0];sel=ctx.sel=f.k;if(f.k==='cat')ctx.sub=f.cats[0].name;if(f.k==='goal')ctx.sub=f.goals.filter(function(g){return p.g[g.id]>=need;})[0].id;}
 var h='<div class="h1" style="font-size:20px;margin-bottom:4px">'+money(need)+' over '+esc(c)+'. Cover it from:</div><div class="foot" style="margin:0 0 12px">'+esc(ctx.lead||'')+'</div>';
 o.forEach(function(x,i){var on=sel===x.k;h+='<button class="opt '+(on?'sel':'')+(x.ok?'':' dis')+'" onclick="coverSel(\''+x.k+'\')"><div class="between"><span class="t">'+(i+1)+'. '+x.t+'</span>'+(on?'<span style="color:var(--lime)">●</span>':'<span style="color:var(--text3)">○</span>')+'</div>';
  if(x.k==='to_assign')h+='<div class="s">'+(x.ok?x.s:'Only '+money(x.have)+' available')+'</div>'+microBar(Math.max(0,p.ta-need),Math.max(1,p.ta),{w:300,color:'var(--pa)',tip:'To assign after · '+money(p.ta-need)});
  if(x.k==='cat'){if(!x.cats.length)h+='<div class="s">No category has leftover</div>';else h+='<div class="chips" style="margin-top:6px">'+x.cats.slice(0,4).map(function(cc){var l=p.b[cc.name]||0;return '<span class="pill '+(on&&ctx.sub===cc.name?'on':'')+'" onclick="event.stopPropagation();coverSel(\'cat\',\''+q(cc.name)+'\')"><span class="sw" style="background:'+SLOT[cc.slot]+'"></span>'+esc(cc.name)+' '+money(l)+(l>=need?' → '+money(l-need):' (short)')+'</span>';}).join('')+'</div>';}
  if(x.k==='goal'){h+='<div class="chips" style="margin-top:6px">'+x.goals.map(function(g){return '<span class="pill '+(on&&ctx.sub===g.id?'on':'')+'" onclick="event.stopPropagation();coverSel(\'goal\',\''+g.id+'\')">'+icon(g.icon,13)+' '+esc(g.name)+' '+money(p.g[g.id]||0)+'</span>';}).join('')+'</div>';
   var g=goalById(on&&ctx.sub?ctx.sub:(x.goals[0]||{}).id);if(g&&g.target){var e0=goalEta(g),e1=goalEta(g,need),dd=e0&&e1?Math.round((e1-e0)/DAY):0;h+='<div class="s" style="margin-top:6px">Goal slip: '+esc(g.name)+' '+goalPct(g)+'% → '+Math.round((goalSaved(g)-need)/g.target*100)+'% · ETA '+(e0?fmtD(e0):'—')+' → '+(e1?fmtD(e1):'—')+' <b class="redt">(+'+dd+' days)</b></div>'+slipLine(g,need);}}
  if(x.k==='letgo'){var nb=6800-need;h+='<div class="s redt">▲ Oct budget starts '+money(need)+' lower</div>'+nextBudgetBar(need);}
  h+='</button>';});
 return h;}

FR.goalReached=function(el){var g=GOALS.filter(function(x){return x.reachedTs;})[0];var ticks=[],tot=0;TX.forEach(function(t){if(t.type==='transfer')t.dst.forEach(function(d){if(d.ref==='goal:'+g.id){tot+=d.amt;ticks.push({a:Math.min(359,tot/g.target*360),color:'var(--lime)',tip:fmtD(t.ts)+' · +'+money(d.amt)+' · '+money(tot)+' total'});}});});
 el.innerHTML='<div class="pad" style="padding-top:20px;text-align:center"><button class="back" style="position:absolute;left:8px;top:8px" onclick="back(\'savings\')">❮</button><div style="display:flex;justify-content:center;margin-top:20px">'+iconRing(1,{s:170,sw:12,icon:g.icon,is:56,color:'var(--ps)',ticks:ticks,tip:g.name+' · '+money(g.target)+' reached '+fmtD(g.reachedTs)})+'</div><div class="h1" style="margin-top:16px">'+esc(g.name)+' reached</div><p class="body2">'+money(g.target)+' in '+ticks.length+' contributions · '+fmtD(g.reachedTs,1)+'</p><p class="foot">Each tick is one contribution. Tap one.</p>'
 +'<button class="btn" style="margin-top:14px" onclick="toast(\'Already moved to Budget: bought on 21 Jul\')">Move to Budget</button><div style="height:8px"></div><button class="btn sec2" onclick="toast(\'Kept in Savings\');back(\'savings\')">Keep in Savings</button><div style="height:8px"></div><button class="btn ghost" onclick="go(\'goalCreate\')">New goal</button></div>';};

function periodCards(fn){return [['monthly','Monthly','Resets on the 1st'],['weekly','Weekly','Resets every Monday'],['payday','Match payday','Resets on day '+S.paydayDay]].map(function(p){return '<button class="opt '+(S.period===p[0]?'sel':'')+'" onclick="S.period=\''+p[0]+'\';'+fn+'"><div class="between"><span class="t">'+p[1]+'</span>'+(S.period===p[0]?'<span style="color:var(--lime)">●</span>':'○')+'</div><div class="s">'+p[2]+'</div></button>';}).join('')
 +(S.period==='payday'?'<div class="frow" style="margin-bottom:8px"><span class="body2">Payday</span><input class="field sm" type="number" min="1" max="31" value="'+S.paydayDay+'" onchange="S.paydayDay=Math.max(1,Math.min(31,+this.value||1));'+fn+'" aria-label="Payday day of month"></div>':'');}
function periodWindow(){if(S.period==='weekly')return [at(8,21),at(8,27)];if(S.period==='payday'){var d=S.paydayDay;var s=d<=DOM?at(8,d):at(7,d);return [s,new Date(new Date(s).getFullYear(),new Date(s).getMonth()+1,d).getTime()-DAY];}return [at(8,1),at(8,30)];}
function periodCal(){var w=periodWindow();return monthCal(8,function(ts){var inw=ts>=w[0]&&ts<=w[1];return {v:0,fill:inw?'rgba(57,135,229,.45)':'var(--surface2)',tip:fmtD(ts)+(inw?' · in this period':'')};},{ch:30});}

 el.innerHTML=subbar('Rules')+'<div class="pad">'+rules.map(function(r){return '<div class="card"><div class="kick">When · '+r[0]+'</div><div class="h2" style="margin-top:4px">'+esc(r[1])+'</div><div class="body2" style="margin-top:4px">→ '+esc(r[2])+'</div></div>';}).join('')
 +'<div class="card"><div class="kick">New rule</div><div class="segw" style="margin-top:8px">'+['Income arrives','Period ends','Each spend'].map(function(x,i){return '<button class="'+((S.ruleTrig||0)===i?'on':'')+'" onclick="S.ruleTrig='+i+';rerender()">'+x+'</button>';}).join('')+'</div><div class="frow" style="margin-top:10px"><input class="field sm" placeholder="₹ or %" aria-label="Amount or percent"><select class="field sm" aria-label="Destination">'+refsAll().map(function(r){return '<option>'+esc(r.n)+'</option>';}).join('')+'</select></div><button class="btn sm" style="margin-top:10px" onclick="toast(\'Rule saved\')">Save rule</button></div>'
 +'<div class="card"><div class="kick">Income split</div><input class="slider" type="range" min="50" max="100" step="5" value="'+S.ruleB+'" oninput="S.ruleB=+this.value;$(\'rb\').textContent=this.value+\'% Budget / \'+(100-this.value)+\'% Savings\'" aria-label="Budget share"><div class="foot" id="rb">'+S.ruleB+'% Budget / '+(100-S.ruleB)+'% Savings</div></div></div>';};
