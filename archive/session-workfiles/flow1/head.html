<title>Trickle v14 — Pay Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a design board in the Viz 1 family. Sections A-F; each is a question, a gallery of dark phone
   frames (rows = options, columns = students or moments), then what the drawing showed. Same tokens as Viz 1. */
:root{
  --bg:#f0f1ec; --surface:#fafaf7; --ink:#14181b; --ink2:#444c54; --muted:#727a83; --line:#d6d9d1;
  --accent:#0d7a64; --accent-soft:#d9ece5; --amber:#a9680f;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111417; --surface:#181c20; --ink:#eef0f1; --ink2:#b9c0c7; --muted:#8a929b; --line:#2b3036;
  --accent:#62dcb4; --accent-soft:#17362e; --amber:#e3a43f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111417; --surface:#181c20; --ink:#eef0f1; --ink2:#b9c0c7; --muted:#8a929b; --line:#2b3036;
  --accent:#62dcb4; --accent-soft:#17362e; --amber:#e3a43f; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:24px;padding-block:40px 80px}
@media (max-width:600px){.wrap{padding-inline:16px;padding-block:24px 56px}}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.12;margin:0}
h1{font-size:clamp(30px,5vw,50px);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(23px,3vw,31px);font-weight:700;letter-spacing:-.01em}
h3{font-size:18px;font-weight:700}
p{margin:0;max-width:68ch}
.eyebrow{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lead{font-size:18px;color:var(--ink2);max-width:62ch}
header.top{display:flex;flex-direction:column;gap:16px;padding-bottom:28px}
section{display:flex;flex-direction:column;gap:18px;padding-block:40px;border-top:1px solid var(--line)}
.sec-h{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.sec-h .k{font-family:var(--display);font-weight:700;font-size:clamp(23px,3vw,31px);color:var(--accent)}
.q{color:var(--ink2)}
ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.logged{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.logged div{border-top:2px solid var(--ink);padding-top:10px}
.logged b{display:block;font-family:var(--display);font-size:17px;margin-bottom:4px}
.logged span{color:var(--ink2);font-size:15px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right}
.opt{display:flex;flex-direction:column;gap:10px}
.opt>h4{margin:0;font-size:15.5px;font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.opt>h4 b{font-family:var(--display);background:var(--ink);color:var(--bg);border-radius:5px;padding:1px 7px;font-size:13.5px}
.opt>h4 span{color:var(--muted);font-weight:400}
.gal{display:flex;flex-direction:column;gap:26px}
.row{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.row.four{grid-template-columns:repeat(4,minmax(200px,1fr))}
.row.three{grid-template-columns:repeat(3,minmax(200px,300px))}
.fg{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.fg figcaption{font-size:13px;color:var(--muted);line-height:1.3}
.fg figcaption b{color:var(--ink);font-weight:600}
svg.ph{width:100%;height:auto;display:block;font-family:var(--body)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px 28px}
.note{border-top:1px solid var(--line);padding-top:10px;font-size:15px;color:var(--ink2)}
.note b{display:block;color:var(--ink);font-family:var(--display);font-size:16px;margin-bottom:3px}
.demo{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:700px){.demo{grid-template-columns:minmax(0,1fr)}}
.ctl{display:flex;flex-direction:column;gap:16px}
.ctl .grp{display:flex;flex-direction:column;gap:7px}
.ctl .lbl{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:14.5px;font-weight:600;white-space:nowrap;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer}
.chip:hover{border-color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{font:inherit;font-size:15px;font-weight:700;padding:10px 18px;border-radius:10px;border:0;background:var(--accent);color:#04231b;cursor:pointer;align-self:flex-start}
.chip:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{width:100%;max-width:420px;accent-color:var(--accent)}
.small{font-size:13.5px;color:var(--muted)}
.decide{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:22px}
.dq{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dq h3{font-size:17px}
.dq ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:5px;font-size:15px;color:var(--ink2);list-style:upper-alpha}
.dq li.s{color:var(--ink)}
.dq li.s::after{content:" suggested";font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-left:4px}

svg.ph rect.bx{transition:fill .6s ease,transform .6s ease}
@media (prefers-reduced-motion: reduce){svg.ph rect.bx{transition:none}}

.lg{animation:lgin .9s ease .7s both}
@keyframes lgin{from{opacity:0}to{opacity:1}}
.static .lg{animation:none}
@media (prefers-reduced-motion: reduce){.lg{animation:none}}

svg.ph [data-open]{cursor:pointer}
svg.ph [data-open]:focus-visible{outline:2px solid #62dcb4;outline-offset:2px}
.lg.now{animation:none}

svg.ph [data-go]{cursor:pointer}
svg.ph [data-go]:focus-visible{outline:2px solid #62dcb4;outline-offset:2px}

svg.ph [data-go]{cursor:pointer}
.sw2{display:flex;gap:8px;flex-wrap:wrap}

svg.ph rect.bx{transition:fill 1.3s ease}
@media (prefers-reduced-motion: reduce){svg.ph rect.bx{transition:none}}

svg.ph [data-go]{cursor:pointer}

.sw3{display:flex;gap:8px;flex-wrap:wrap}





.rt{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rt table{min-width:960px;font-size:14px}
.rt td{white-space:normal;vertical-align:top;min-width:150px}
.rt td:first-child{min-width:130px;font-weight:600}
.rt th{white-space:nowrap}
.ref{display:inline-block;font-size:11.5px;letter-spacing:.04em;background:var(--accent-soft);color:var(--ink);border-radius:5px;padding:0 6px;margin-left:4px;font-weight:600}
.tap3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.tap3 .box{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.tap3 b{font-family:var(--display);display:block;margin-bottom:4px}
.tap3 span{color:var(--ink2);font-size:15px}
</style>
