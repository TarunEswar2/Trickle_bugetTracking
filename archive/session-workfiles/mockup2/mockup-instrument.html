function habitCells(h,scale,mode){const val=t=>mode==='times'?1:t.amt;const out=[];
 if(scale==='month'){const ws=startOfWeek(S.now);const start=new Date(ws.getTime()-4*7*DAY);for(let i=0;i<35;i++){const d0=start.getTime()+i*DAY;const sum=h.list.filter(t=>t.t>=d0&&t.t<d0+DAY).reduce((a,t)=>a+val(t),0);out.push({v:sum,label:new Date(d0).getDate(),w:new Date(d0).toDateString()})}return {cols:7,cells:out}}
 if(scale==='day'){for(let hr=0;hr<24;hr++){const sum=h.list.filter(t=>new Date(t.t).getHours()===hr).reduce((a,t)=>a+val(t),0);out.push({v:sum,label:hr,w:`${hr%12||12} ${hr<12?'am':'pm'}`})}return {cols:6,cells:out}}
 const blocks=[[5,11,'morning'],[11,16,'afternoon'],[16,21,'evening'],[21,29,'night']];blocks.forEach(b=>{for(let d=0;d<7;d++){const sum=h.list.filter(t=>{const dt=new Date(t.t);const dd=(dt.getDay()+6)%7;let hr=dt.getHours();if(hr<5)hr+=24;return dd===d&&hr>=b[0]&&hr<b[1]}).reduce((a,t)=>a+val(t),0);out.push({v:sum,label:'',w:`${DOW[d]} ${b[2]}`})}});return {cols:7,cells:out}}
function hotHtml(cells,cols,sel,color,w){const mx=Math.max(1,...cells.map(c=>c.v));return `<div class="hot" style="grid-template-columns:repeat(${cols},1fr);width:${w}px;margin:0 auto">${cells.map((c,i)=>{if(!c.v)return `<i data-a="hsel|${i}" style="display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#3b4350;${sel===i?'outline:2px solid #fff;':''}">${c.label}</i>`;const a=.25+.75*c.v/mx;return `<i data-a="hsel|${i}" style="background:${color};opacity:${a.toFixed(2)};box-shadow:${c.v/mx>.6?'0 0 16px '+color+'cc':'none'};display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#2a1604;${sel===i?'outline:2px solid #fff;':''}">${c.label}</i>`}).join('')}</div>`}
function hotSentence(cells,scale,subject){const top=[...cells].map((c,i)=>({...c,i})).sort((a,b)=>b.v-a.v)[0];if(!top||!top.v)return `${subject} fills in as you go.`;if(scale==='day')return `${subject} most around ${top.w}.`;if(scale==='week')return `${subject} most on ${top.w.toLowerCase()}s.`.replace('s.','.').replace(/(\w+) (\w+)s\./,'$1 $2.');return `${subject} most around the ${top.label}th.`}

 const sent=hotSentence(cells,sc==='week'?'week':sc,esc(payee)).replace(/^(.*)$/,'$1');const tot=h.list.reduce((a,t)=>a+t.amt,0);
 return `<button class="back" data-a="back">‹ Repeats</button><div class="title">${esc(payee)}</div><div class="sub" style="margin:4px 0 12px">×${h.n} in 30 days</div>

  <div class="li"><span class="d" style="background:${BUFC}"></span><span class="n">Buffer</span><span class="a">${money(Math.max(0,buf))}</span></div></div>

H.bmode=a=>{const B=UI.viz.bud;B.mode=a[0];const pool=S.flexW;if(a[0]==='equal'){const each=r5(.9*pool/S.cats.length);S.cats.forEach(c=>B.vals[c.id]=Math.max(each,c.amt-c.left))}else if(a[0]==='preset'){const tot=S.cats.reduce((x,c)=>x+(S.lastSplit?S.lastSplit[c.id]:c.amt),0)||1;S.cats.forEach(c=>{const base=S.lastSplit?S.lastSplit[c.id]:c.amt;B.vals[c.id]=Math.max(r5(base/tot*.9*pool),c.amt-c.left)})}};

  ['A bill is due now (unpaid)',()=>{const b=S.bills[0];if(!b)return say('This profile has no fixed bills.');b.dueNow=true;b.nextDue=new Date(S.now);say(b.name+' is due.')}]]},
 {h:'Goals',items:[
  ['A goal reaches its target',()=>{if(!g0)return say('No active goal.');g0.saved=g0.target;g0.hist[11]=(g0.hist[11]||0)+Math.max(0,g0.target-g0.saved);reachedCheck(S);logE(S,g0.name+' reached its target')}],
  ['Add ₹500 to a goal',()=>{if(!g0)return say('No active goal.');g0.saved=Math.min(g0.target,g0.saved+500);g0.hist[11]=(g0.hist[11]||0)+500;reachedCheck(S);say('₹500 added to '+g0.name+'.')}]]}
]};
function maybeWeek(){if(S.pending.length){UI.popup={id:'weekend',step:S.p.mode==='manual'?'bal':1,sel:S.goals.filter(g=>g.state==='active').map(g=>g.id)}}}
const FLAGS=[['bankDecline','Bank declines the next payment'],['bankSlow','Bank is slow (waiting state)'],['lowBalance','Account balance is low'],['linkLost','UPI link needs a refresh']];
function renderPanel(){const el=$('#panel');if(!el||!S)return;const sp=spentThisWeek(S);
 const potRows=[['Money left this week',money(flexLeft(S))+' of '+money(S.flexW)],['Buffer left',money(S.bufLeft)+' of '+money(S.bufAmt)],['Spent this week',money(sp)],['Fixed reserve',money(S.bills.reduce((a,b)=>a+b.reserve,0))],['Goals saved',money(S.goals.filter(g=>g.state!=='done').reduce((a,g)=>a+g.saved,0))],['Free savings',money(S.free)],['Unsorted payments',String(S.unsorted.length)],['Unsorted credits',String(S.credits.length)]];
 const flexSum=S.cats.reduce((a,c)=>a+c.amt,0)+S.bufAmt;const okInv=flexSum===S.flexW;
 el.innerHTML=`<div class="pc" style="background:linear-gradient(135deg,#12261f,#0c1017)"><div style="font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1">Trickle mockup</div><div class="sm" style="margin-top:6px">Everything in the phone is computed from a live ledger. Pick a profile, tap around, then use <b>Simulate</b> to make things happen: a payment on your link, a credit, a bill, the week ending, a goal reached, a bank that declines. The <b>Ledger</b> shows where every rupee is.</div></div><div class="pc"><h3>Profile</h3><div class="col" style="gap:6px">${Object.values(PROFILES).map(p=>`<button class="prof ${S.key===p.key?'on':''}" data-p="${p.key}"><b>${p.name}</b><span>${p.blurb}</span></button>`).join('')}</div></div>
 <div class="pc"><h3>Simulate</h3>${EVENTS().map((g,gi)=>`<div class="cap" style="margin:${gi?12:0}px 0 6px">${g.h}</div><div class="pgrid">${g.items.map((it,i)=>`<button class="pbtn" data-e="${gi}|${i}">${esc(it[0])}</button>`).join('')}</div>`).join('')}
  <div class="cap" style="margin:12px 0 6px">Switches</div><div class="pgrid">${FLAGS.map(f=>`<button class="pbtn ${S.flags[f[0]]?'on':''}" data-f="${f[0]}">${S.flags[f[0]]?'● ':'○ '}${f[1]}</button>`).join('')}</div></div>
 <div class="pc"><h3>Ledger</h3><div class="pot">${potRows.map(r=>`<span>${r[0]}</span><b>${r[1]}</b>`).join('')}<span>Categories + buffer = week</span><b style="color:${okInv?'#62DCB4':'#E3A43F'}">${okInv?'balanced ✓':'check'}</b></div></div>
 <div class="pc"><h3>What just happened</h3><div class="log">${S.log.slice(0,10).map(l=>`<div><span class="mut">${l.t.toLocaleDateString('en-IN',{weekday:'short'})} ${fmtTime(l.t)}</span> · ${esc(l.text)}</div>`).join('')||'<span class="mut">Nothing yet. Try a simulation.</span>'}</div></div>
 <div class="pc"><h3>Not in this mockup</h3><div class="sm">Onboarding has its own board: <a style="color:#63E6A5" href="https://claude.ai/artifact/16Z1Z4yx1VDWk3AT7rYP6j" target="_blank" rel="noopener">onboarding ↗</a>. The blueprint lists every screen: <a style="color:#63E6A5" href="https://claude.ai/artifact/RVjueXaXCsmCKyF6UUEErj" target="_blank" rel="noopener">blueprint ↗</a>. Look and tokens: <a style="color:#63E6A5" href="https://claude.ai/artifact/3vrR99iZ8rmzw51MeFRXde" target="_blank" rel="noopener">design system ↗</a>.</div></div>`}
document.addEventListener('click',e=>{const p=e.target.closest('[data-p]');if(p){loadProfile(p.dataset.p);return}const v=e.target.closest('[data-e]');if(v){const [g,i]=v.dataset.e.split('|').map(Number);EVENTS()[g].items[i][1]();render();return}const f=e.target.closest('[data-f]');if(f){S.flags[f.dataset.f]=!S.flags[f.dataset.f];if(f.dataset.f==='linkLost'&&S.flags.linkLost)say('The link needs a refresh.');render()}});
loadProfile('Y');


</script></body></html>
