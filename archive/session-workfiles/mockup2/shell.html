<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trickle v14 — Mockup (Instrument)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Space+Mono:wght@400;700&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
:root{--bg0:#0E0E10;--bg1:#17181B;--bg2:#17181B;--bg3:#232427;--line:#2E3033;--ink:#E9E5DC;--ink2:#B9B4A8;--ink3:#8A8578;--spend:#FF8A3D;--save:#63E6A5;--amber:#FF9F0A;--buf:#9AA4B0;--fix:#8D7A66;--sig:#FF6A1A;
--display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--mono:"Space Mono",ui-monospace,Menlo,monospace;--body:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
--fbg:#0E0E10;--k1:#ff8340;--k2:#ff6a1a;--ki:#1a0a02}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:#9FAE9A;color:#0E0E10;font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh}
.app{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;max-width:1240px;margin:0 auto;padding:16px 20px}
@media (max-width:980px){.app{grid-template-columns:1fr}}
.stage{display:flex;justify-content:center;align-items:flex-start;position:sticky;top:12px;height:calc(100vh - 24px)}
@media (max-width:980px){.stage{position:static;height:auto}}
#frame{position:relative;width:390px;height:844px;transform-origin:top center}
#phone{--fi:#E9E5DC;--fi2:#B9B4A8;--fi3:#8A8578;--tabc:#FF8A3D;position:absolute;left:0;top:0;width:390px;height:844px;border-radius:48px;overflow:hidden;border:3px solid #0E0E10;background:var(--fbg);box-shadow:0 30px 70px rgba(0,0,0,.35);transition:background .22s ease-out}
#phone[data-f=income]{--fbg:#E9E5DC;--fi:#0E0E10;--fi2:#34322c;--fi3:#6b665c;--tabc:#E9E5DC}
#phone[data-f=spending]{--fbg:#FF6A1A;--fi:#0E0E10;--fi2:#3a1a08;--fi3:#5a280b;--k1:#34363a;--k2:#17181B;--ki:#E9E5DC;--tabc:#FF6A1A}
#phone[data-f=savings]{--fbg:#2F9D5A;--fi:#04160b;--fi2:#0b3a1d;--fi3:#0f4a26;--k1:#34363a;--k2:#17181B;--ki:#E9E5DC;--tabc:#63E6A5}
#phone[data-f=insights]{--fbg:#FFC20A;--fi:#0E0E10;--fi2:#3a2c00;--fi3:#5a4400;--k1:#34363a;--k2:#17181B;--ki:#E9E5DC;--tabc:#FFC20A}
.notch{position:absolute;left:150px;top:10px;width:90px;height:24px;border-radius:12px;background:#000;z-index:50}
.status{position:absolute;left:0;right:0;top:0;height:50px;background:linear-gradient(180deg,var(--fbg) 55%,transparent);display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--fi2);z-index:40;pointer-events:none}
#view{position:absolute;left:0;right:0;top:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding:54px 22px 120px;scrollbar-width:none;color:var(--fi);--ink:var(--fi);--ink2:var(--fi2);--ink3:var(--fi3)}
#view::-webkit-scrollbar{display:none}
#view.snap{scroll-snap-type:y proximity;scroll-padding-top:54px}
#tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;justify-content:space-around;background:#0E0E10;border-top:2px solid #232427;padding:10px 4px 22px;z-index:30}
#tabbar button{flex:1;background:none;border:0;color:#8A8578;font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;position:relative;padding-top:12px;cursor:pointer}
#tabbar button.on{color:#E9E5DC;font-weight:700}
#tabbar button.on::before{content:"";position:absolute;top:0;left:50%;margin-left:-14px;width:28px;height:5px;border-radius:2px;background:var(--c);box-shadow:0 0 10px var(--c)}
#tabbar button:nth-child(1){--c:#FF8A3D}#tabbar button:nth-child(2){--c:#E9E5DC}#tabbar button:nth-child(3){--c:#FF6A1A}#tabbar button:nth-child(4){--c:#63E6A5}#tabbar button:nth-child(5){--c:#FFC20A}
#tabbar .dot{position:absolute;top:6px;left:calc(50% + 16px);width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
#layer{position:absolute;inset:0;z-index:60;pointer-events:none}
#layer>*{pointer-events:auto}
.sheet,.modal,.toast{--ink:#E9E5DC;--ink2:#B9B4A8;--ink3:#8A8578;--fbg:#0E0E10;--k1:#ff8340;--k2:#ff6a1a;--ki:#1a0a02;color:var(--ink)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);animation:fade .25s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#17181B;border-radius:28px 28px 0 0;border-top:2px solid #2E3033;padding:22px 22px 30px;max-height:88%;overflow:auto;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.modal{position:absolute;inset:0;overflow:hidden;animation:fade .25s ease;background:#0E0E10}
.modal .mbody{position:absolute;inset:0;overflow-y:auto;padding:54px 22px 110px;scrollbar-width:none}
.modal .mfoot{position:absolute;left:0;right:0;bottom:0;padding:12px 22px 28px;background:linear-gradient(180deg,transparent,#0E0E10 30%)}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.02}
.title{font-family:var(--display);font-weight:800;font-size:38px;line-height:.98;text-transform:uppercase}
.h2{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.02;text-transform:uppercase}
.cap{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.sub{color:var(--ink2)}.mut{color:var(--ink3)}.sm{font-size:13.5px;color:var(--ink2)}
.btn{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:14px;border:0;border-radius:16px;padding:0 20px;height:54px;cursor:pointer;color:var(--ki);background:linear-gradient(180deg,var(--k1),var(--k2));box-shadow:0 3px 0 #0a0a0b,inset 0 1px 0 rgba(255,255,255,.22);width:100%}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0a0b,inset 0 1px 0 rgba(255,255,255,.1)}
.btn.o{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--ink3)}
.btn.q{background:linear-gradient(180deg,#34363a,#222326);color:#E9E5DC}
.btn.g{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--ink)}
.btn.d{background:#1b1c1f;color:#6b665c;box-shadow:none;cursor:not-allowed}
.btn.k{background:linear-gradient(180deg,#34363a,#17181B);color:#E9E5DC}
.btn.s{height:40px;font-size:12px;width:auto;padding:0 16px;border-radius:14px}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.sp{justify-content:space-between}.col{display:flex;flex-direction:column}
.chip{font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;font-weight:700;font-size:11.5px;padding:8px 13px;border-radius:999px;border:1.5px solid var(--ink3);background:transparent;color:var(--ink2);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--fbg);border-color:var(--ink)}
.seg{display:flex;gap:8px}.seg .chip{flex:1;text-align:center;padding:10px 0}
.card,.li,.tile,.banner,.field,.hot,.lg,.pc{--ink:#E9E5DC;--ink2:#B9B4A8;--ink3:#8A8578;--fbg:#17181B;--k1:#ff8340;--k2:#ff6a1a;--ki:#1a0a02;color:var(--ink)}
.card{background:#17181B;border:1.5px solid #0E0E10;border-radius:18px;padding:14px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#17181B;border-radius:14px;border:1.5px solid #0E0E10;cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--ink)}
.li .d{width:10px;height:10px;border-radius:50%;flex:none}.li .n{flex:1;font-weight:600;min-width:0}.li .t{color:var(--ink3);font-size:13px}.li .a{font-family:var(--display);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tile{background:#17181B;border:1.5px solid #2E3033;border-radius:14px;padding:9px 11px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.tile b{display:flex;gap:8px;align-items:center;font-size:13.5px}.tile i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}.tile small{display:block;color:var(--ink3);font-size:11.5px;margin-top:1px}
.tile.on{box-shadow:0 0 14px var(--glow,rgba(255,138,61,.35))}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;background:#070708;padding:10px;border-radius:16px;box-shadow:inset 0 0 0 2px #1d1e21,inset 0 6px 18px rgba(0,0,0,.8)}.lg i{aspect-ratio:1;border-radius:24%;display:block;transition:background .5s,opacity .4s,box-shadow .5s}
svg[role=img]{background:#070708;border-radius:22px;box-shadow:inset 0 0 0 2px #1d1e21}
.chipscale{display:inline-block;background:#070708;color:#FF8A3D;border-radius:10px;padding:6px 14px;font-family:var(--mono);font-weight:700;font-size:15px}
.banner{background:#17181B;border:1.5px solid #FF9F0A;border-radius:14px;padding:11px 14px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.kp button{background:linear-gradient(180deg,#34363a,#222326);border:0;color:#E9E5DC;font-family:var(--mono);font-size:19px;font-weight:700;height:44px;cursor:pointer;border-radius:12px;box-shadow:0 2px 0 #0a0a0b,inset 0 1px 0 rgba(255,255,255,.15)}.kp button:active{transform:translateY(2px);box-shadow:none}
.field{background:#070708;border:1.5px solid #2E3033;border-radius:16px;padding:8px 16px;font-family:var(--display);font-size:38px;font-weight:700;color:#FF8A3D}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;background:#0E0E10;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfcabc);border:3px solid #0E0E10;box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer}
.hot{display:grid;gap:5px;background:#070708;padding:10px;border-radius:14px}.hot i{aspect-ratio:1;border-radius:9px;background:#17181B;display:block}
.toast{position:absolute;left:22px;right:22px;top:58px;background:#17181B;border:1.5px solid #FF6A1A;border-radius:14px;padding:11px 14px;font-size:14px;animation:up .3s;z-index:5}
.spacer{height:14px}.sec{min-height:560px;padding-top:6px;scroll-snap-align:start}
.back{background:none;border:0;color:var(--ink2);font-family:var(--mono);text-transform:uppercase;font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer;padding:0;margin-bottom:8px}
.lnk{color:#63E6A5;font-weight:700;cursor:pointer;background:none;border:0;font:inherit;padding:0;text-decoration:underline}
#view .lnk{color:var(--ink)}
.mesh{position:relative;overflow:hidden}
.panel{--ink:#0E0E10;--ink2:#2b3a2b;--ink3:#3f503f;display:flex;flex-direction:column;gap:14px;padding-bottom:40px;color:#0E0E10}
.pc{background:#0E0E10;border:0;border-radius:18px;padding:14px}
.pc h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;font-family:var(--mono);font-weight:700}
.pbtn{font:inherit;font-size:13px;font-weight:600;padding:7px 11px;border-radius:10px;border:1px solid #34363A;background:#17181B;color:var(--ink);cursor:pointer;text-align:left}
.pbtn:hover{border-color:#FF6A1A}.pbtn.on{background:#2a1608;border-color:#FF6A1A}
.pgrid{display:flex;flex-wrap:wrap;gap:6px}
.prof{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid #34363A;background:#17181B;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.prof.on{border-color:#FF6A1A;background:#2a1608}.prof b{font-size:14.5px}.prof span{font-size:12px;color:var(--ink3);display:block}
.pot{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}.pot span:nth-child(odd){color:var(--ink3)}
.log{max-height:200px;overflow:auto;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
#layer.still *{animation:none!important}
#phone *{scrollbar-width:none}#phone *::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app"><div class="stage"><div id="frame"><div id="phone"><div class="notch"></div><div class="status"><span id="clk"></span><span>●●● 5G ▮</span></div><div id="view"></div><div id="tabbar"></div><div id="layer"></div></div></div></div>
<aside class="panel" id="panel"></aside></div>
<script>
