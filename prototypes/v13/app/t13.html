<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Trickle — v13</title>
<meta name="description" content="Clickable prototype of Trickle v13: a UPI student budgeting app with a gradient identity where one dot is always ₹100.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>/* Trickle v12 — direction A "Monochrome glow" (dark) + light companion (from B) + B&W option.
   Layout: one 412px Android phone; floating tab pill + round Pay button; cards hold dots, glow only for time. */
:root{--bg:#f4f4f2;--card:#ffffff;--card2:#efefec;--ink:#141416;--ink2:#55555c;--ink3:#7a7a80;--line:#e2e2de;--glow:#141416;
 --j0:#b7791f;--j1:#2f63c9;--j2:#93306b;--sv:#1f9b84;--inc:#5d5d63;--cardbg:#ffffff;--hl:rgba(255,255,255,.55);--shade:rgba(20,20,22,.36);
 --f:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fm:'Geist Mono',ui-monospace,'SFMono-Regular',monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--card:#18181a;--card2:#222225;--ink:#f4f4f5;--ink2:#b4b4ba;--ink3:#8c8c93;--line:#2c2c30;--glow:#ffffff;
 --j0:#ad7c26;--j1:#5a8ae6;--j2:#b9407f;--sv:#22a385;--inc:#cfcfd4;--cardbg:linear-gradient(180deg,#1d1d20,#151517);--hl:rgba(255,255,255,.22);--shade:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0c;--card:#18181a;--card2:#222225;--ink:#f4f4f5;--ink2:#b4b4ba;--ink3:#8c8c93;--line:#2c2c30;--glow:#ffffff;
 --j0:#ad7c26;--j1:#5a8ae6;--j2:#b9407f;--sv:#22a385;--inc:#cfcfd4;--cardbg:linear-gradient(180deg,#1d1d20,#151517);--hl:rgba(255,255,255,.22);--shade:rgba(0,0,0,.6);color-scheme:dark}
/* in-app override (G-S1 Look): data-mode on the phone */
.phone[data-mode="dark"]{--bg:#0b0b0c;--card:#18181a;--card2:#222225;--ink:#f4f4f5;--ink2:#b4b4ba;--ink3:#8c8c93;--line:#2c2c30;--glow:#ffffff;
 --j0:#ad7c26;--j1:#5a8ae6;--j2:#b9407f;--sv:#22a385;--inc:#cfcfd4;--cardbg:linear-gradient(180deg,#1d1d20,#151517);--hl:rgba(255,255,255,.22);--shade:rgba(0,0,0,.6);color-scheme:dark}
.phone[data-mode="light"]{--bg:#f4f4f2;--card:#ffffff;--card2:#efefec;--ink:#141416;--ink2:#55555c;--ink3:#7a7a80;--line:#e2e2de;--glow:#141416;
 --j0:#b7791f;--j1:#2f63c9;--j2:#93306b;--sv:#1f9b84;--inc:#5d5d63;--cardbg:#ffffff;--hl:rgba(255,255,255,.55);--shade:rgba(20,20,22,.36);color-scheme:light}
.phone.bw{--j0:var(--ink2);--j1:var(--ink2);--j2:var(--ink2);--sv:var(--ink);--inc:var(--ink3)}
.phone.bw .m.j1.solid{fill:url(#pt-stripe-j1)}.phone.bw .m.j2.solid{fill:url(#pt-dot-j2)}.phone.bw .m.j0.solid.pt{fill:url(#pt-stripe-j0)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
.stage{width:100%;max-width:412px;height:100%;max-height:900px;display:flex;flex-direction:column}
.phone{position:relative;flex:1;min-height:0;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
@media (min-width:600px){body{align-items:center;padding-block:16px;box-sizing:border-box}.stage{height:860px}.phone{border-radius:34px;outline:6px solid #050505;box-shadow:0 20px 60px rgba(0,0,0,.25)}}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---- header ---- */
.hd{display:flex;align-items:center;gap:4px;padding:12px 12px 6px 20px;min-height:56px;flex:none}
.hd h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0;flex:1;text-wrap:balance}
.hd .wm{flex:1}
.ib{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;position:relative;color:var(--ink2)}
.ib:hover{background:var(--card2)}.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib .bd{position:absolute;top:11px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--bg)}
.av{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--ink)}
.back{margin-left:-12px}
/* ---- wordmark L3 ---- */
.wm b{font-weight:700;letter-spacing:-.04em;font-size:26px}
.wm .tdot{display:inline-block;width:.26em;height:.26em;border-radius:50%;background:var(--ink);margin-left:.06em;vertical-align:baseline}
/* ---- scroll area ---- */
.scr{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px 120px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.nobar{padding-bottom:28px}
/* ---- cards ---- */
.card{background:var(--cardbg);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.card h2,.card h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.card .sub{color:var(--ink2);font-size:13.5px;margin:0}
.eyb{font:500 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .wide{grid-column:1/-1}
.tile{cursor:pointer;text-align:left;min-height:132px}
.tile:hover{border-color:var(--ink3)}
.addw{border-style:dashed;display:grid;place-items:center;color:var(--ink2);min-height:132px;background:none}
.row{display:flex;align-items:center;gap:10px;min-width:0}.row>.grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:500}.li .t small{color:var(--ink3);font-size:12.5px}
.li .amt{font-variant-numeric:tabular-nums;color:var(--ink2)}
.chev{color:var(--ink3)}
.jarname{display:flex;align-items:center;gap:8px;font-weight:500}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.sw.j0{background:var(--j0)}.sw.j1{background:var(--j1)}.sw.j2{background:var(--j2)}.sw.sv{background:var(--sv)}.sw.inc{background:var(--inc)}.sw.pt{background:repeating-linear-gradient(45deg,var(--j0) 0 2px,var(--card) 2px 3px)}
/* ---- dots ---- */
svg.dots{display:block;max-width:100%;height:auto;overflow:visible}
svg.dz{cursor:zoom-in}
.m{stroke:var(--hl);stroke-width:.5}
.m.solid.j0{fill:var(--j0)}.m.solid.j1{fill:var(--j1)}.m.solid.j2{fill:var(--j2)}.m.solid.sv{fill:var(--sv)}.m.solid.inc{fill:var(--inc)}.m.solid.ink{fill:var(--ink)}
.m.out,.m.held,.m.owed,.m.ghost{fill:none;stroke-width:1.6}
.m.out.j0,.m.held.j0,.m.owed.j0{stroke:var(--j0)}.m.out.j1,.m.held.j1,.m.owed.j1{stroke:var(--j1)}.m.out.j2,.m.held.j2,.m.owed.j2{stroke:var(--j2)}.m.out.sv,.m.held.sv,.m.owed.sv{stroke:var(--sv)}.m.out.inc,.m.held.inc,.m.owed.inc{stroke:var(--inc)}.m.out.ink{stroke:var(--ink)}
.m.held,.m.owed{stroke-dasharray:2.2 1.6}
.m.ghost{stroke:var(--ink3);stroke-dasharray:1 1.6;stroke-width:1.1}
.m.hatch{fill:url(#pt-hatch);stroke:var(--ink2);stroke-width:1}
.m.ring{fill:none;stroke:var(--line);stroke-width:1}
.d1{display:inline-block;vertical-align:-1px}
.key{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--fm);color:var(--ink2);margin:0;padding:4px 10px;border:1px solid var(--line);border-radius:20px;align-self:flex-start}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin:0}.legend span{display:inline-flex;align-items:center;gap:5px}
.zoomcap{font-size:13px;color:var(--ink2);margin:0}
/* glow: only time / position */
svg.glow .gd{fill:var(--line)}svg.glow .gd.lit{fill:var(--ink3)}svg.glow .gd.now{fill:var(--glow);filter:url(#glowf)}
svg.glow .gm line{stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 2}
.lane{display:flex;align-items:center;gap:8px;min-height:22px}.lane .lb{width:34px;font:500 11px var(--fm);color:var(--ink3)}
.lane .bar{flex:1;display:flex;gap:2px;align-items:center;transition:all .4s}
.lane.today{border-radius:12px;box-shadow:0 0 0 1.5px var(--glow),0 0 12px -2px var(--glow);padding:3px 6px;margin:0 -6px}
/* ---- buttons ---- */
.btn{min-height:48px;border-radius:24px;padding:0 20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.block{width:100%}
.btn.ghostb{background:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:8px;font-size:14px}
.chip[aria-pressed="true"],.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice{display:flex;flex-direction:column;gap:8px}
.opt{min-height:56px;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:10px 16px;text-align:left;display:flex;align-items:center;gap:12px;width:100%}
.opt b{font-weight:600;display:block}.opt small{color:var(--ink2);font-size:13px}
.opt.def{border-color:var(--ink)}
.link{color:var(--ink);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.tog{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;min-height:44px;background-clip:content-box;padding:6px 0}
.tog::after{content:"";position:absolute;top:10px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--ink3);transition:left .2s}
.tog[aria-checked="true"]{background-color:var(--ink)}.tog[aria-checked="true"]::after{left:24px;background:var(--bg)}
input.inp{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;width:100%;box-sizing:border-box}
.big{font-size:44px;font-weight:600;letter-spacing:-.03em;margin:0}
.lead{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.muted{color:var(--ink2)}.small{font-size:13px}
p{margin:0}
/* ---- tab bar + pay ---- */
.tb{position:absolute;left:12px;right:12px;bottom:14px;display:flex;align-items:center;gap:10px;z-index:5;pointer-events:none}
.pill{flex:1;display:flex;justify-content:space-around;background:var(--card);border:1px solid var(--line);border-radius:32px;height:64px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:auto;padding:0 4px}
.tbb{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--ink3);position:relative}
.tbb svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tbb[aria-current="page"]{color:var(--ink);background:var(--card2)}
.payb{width:64px;height:64px;border-radius:32px;background:var(--ink);color:var(--bg);display:grid;place-items:center;pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.25);flex:none}
.payb svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* ---- sheets ---- */
.shade{position:absolute;inset:0;background:var(--shade);z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;border-radius:28px 28px 0 0;padding:10px 20px 24px;display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto;box-sizing:border-box}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.toast{position:absolute;left:16px;right:16px;bottom:92px;z-index:20;background:var(--ink);color:var(--bg);border-radius:18px;min-height:52px;display:flex;align-items:center;padding:4px 6px 4px 16px;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast span{flex:1}.toast button{min-height:44px;padding:0 14px;font-weight:600;color:var(--bg);text-decoration:underline}
/* ---- pay ---- */
.cam{flex:1;background:#050505;color:#f4f4f5;display:flex;flex-direction:column;position:relative}
.vf{margin:24px auto 16px;width:240px;height:240px;border-radius:28px;position:relative;background:radial-gradient(circle at 50% 50%,#1c1c1e,#0a0a0a)}
.vf i{position:absolute;width:40px;height:40px;border:3px solid #f4f4f5}.vf i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:20px 0 0 0}.vf i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 20px 0 0}.vf i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 20px}.vf i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 20px 0}
.cam .chip{background:#1c1c1e;border-color:#333;color:#f4f4f5}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pad button{min-height:52px;border-radius:16px;font-size:22px;font-weight:500}.pad button:hover{background:var(--card2)}
.amtv{font-size:52px;font-weight:600;letter-spacing:-.03em;text-align:center;margin:8px 0 0}
.hg{display:flex;flex-direction:column;align-items:center;gap:8px}
svg.dots .m,svg.dots .crumb,svg.glow .gd,svg.bangle{transform-box:fill-box;transform-origin:center}
.fxclone,.fxclone *{pointer-events:none!important}
/* ---- onboarding ---- */
.ob{flex:1;display:flex;flex-direction:column;padding:28px 20px 24px;gap:16px;overflow-y:auto}
.ob h1{font-size:28px;letter-spacing:-.02em;margin:0;font-weight:600;text-wrap:balance}
.ob .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.splash{flex:1;display:grid;place-items:center;align-content:center;gap:14px;cursor:pointer}
.splash .wm b{font-size:44px}
.trk{display:flex;gap:5px}.trk i{width:9px;height:9px;border-radius:50%;background:var(--ink);}
/* ---- intros ---- */
.intro{flex:1;display:flex;flex-direction:column;padding:28px 20px 24px;gap:18px;overflow-y:auto}
.intro h1{font-size:30px;letter-spacing:-.02em;margin:0;font-weight:600;text-wrap:balance}
/* ---- android previews ---- */
.shadebox{background:#202124;color:#e8eaed;border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ntf{background:#2d2e31;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ntf .nh{font-size:11.5px;color:#9aa0a6;display:flex;gap:6px}.ntf b{font-weight:600}.ntf .na{color:#a8c7fa;font-weight:600;min-height:44px;display:inline-flex;align-items:center;align-self:flex-start}
.hs{background:linear-gradient(160deg,#30343c,#16181c);border-radius:24px;padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.aw{background:rgba(20,20,22,.82);color:#f4f4f5;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:6px;justify-content:center;--line:#3a3a3e;--glow:#fff;--ink3:#8c8c93;--j0:#ad7c26;--j1:#5a8ae6;--j2:#b9407f;--sv:#22a385;--ink:#f4f4f5;--card:#18181a;--hl:rgba(255,255,255,.22)}
.aw.w41{grid-column:span 4}.aw.w22{grid-column:span 2;aspect-ratio:1}.aw.w21{grid-column:span 2}
.poster{background:#0b0b0c;color:#f4f4f5;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;--line:#2c2c30;--j0:#ad7c26;--j1:#5a8ae6;--j2:#b9407f;--sv:#22a385;--ink:#f4f4f5;--hl:rgba(255,255,255,.22);--card:#18181a}
.story{min-height:380px;justify-content:center}
.bangle circle{fill:none;stroke-width:10}.bangle .bg{stroke:var(--line)}.bangle .fg{stroke:var(--sv);stroke-linecap:round}
.dash{border:1.6px dashed var(--line)}
.prog{display:flex;gap:4px}.prog i{flex:1;height:3px;border-radius:2px;background:var(--line)}.prog i.on{background:var(--ink)}
.reduced *,.reduced *::before,.reduced *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.chev svg,.opt>svg,.chip svg:not(.d1),.addw svg,.aw>svg:not(.dots):not(.glow),.hgi,.li svg.chev{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hgi{width:40px;height:40px}.addw svg{width:24px;height:24px}.aw>svg:not(.dots):not(.glow){width:24px;height:24px}
.zoomed{display:flex;flex-direction:column;gap:6px}
.lanes{display:flex;flex-direction:column;gap:6px}
details summary{cursor:pointer}

.scr>*,.ob>*,.sheet>*,.intro>*,.card>*{flex-shrink:0}
svg.dz{min-height:44px}
.chips .chip{min-width:44px;justify-content:center}
.li .amt svg.dots{display:inline-block;vertical-align:middle}

/* ===== Trickle v13 identity layer (on top of v12 style.css) =====
   Ground #121318 (Zentra near-black), raised cards, Tarun's gradients as glows, gradient-depth marks. */
:root{--bg:#f5f5f2;--card:#ffffff;--card2:#eeeeea;--ink:#16171b;--ink2:#55565e;--ink3:#787982;--line:#e0e0dc;
 --j0:#B7791F;--j1:#2F63C9;--j2:#93306B;--sv:#1F9B84;--inc:#5d5d63;--zfade:#f5f5f2;--zink:#16171b;--zsub:#5c5d65;--glowop:.55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121318;--card:#1b1c22;--card2:#26272e;--ink:#F9FAFB;--ink2:#a6a7ae;--ink3:#80818a;--line:#2b2c34;
 --j0:#B8862A;--j1:#4F8CEB;--j2:#B9459A;--sv:#2AA67A;--inc:#c9c9ce;--cardbg:linear-gradient(180deg,#1e1f26,#18191e);--zfade:#121318;--zink:#F9FAFB;--zsub:#9c9da5;--glowop:1}}
:root[data-theme="dark"],.phone[data-mode="dark"]{--bg:#121318;--card:#1b1c22;--card2:#26272e;--ink:#F9FAFB;--ink2:#a6a7ae;--ink3:#80818a;--line:#2b2c34;
 --j0:#B8862A;--j1:#4F8CEB;--j2:#B9459A;--sv:#2AA67A;--inc:#c9c9ce;--cardbg:linear-gradient(180deg,#1e1f26,#18191e);--zfade:#121318;--zink:#F9FAFB;--zsub:#9c9da5;--glowop:1;color-scheme:dark}
.phone[data-mode="light"]{--bg:#f5f5f2;--card:#ffffff;--card2:#eeeeea;--ink:#16171b;--ink2:#55565e;--ink3:#787982;--line:#e0e0dc;
 --j0:#B7791F;--j1:#2F63C9;--j2:#93306B;--sv:#1F9B84;--inc:#5d5d63;--cardbg:#ffffff;--zfade:#f5f5f2;--zink:#16171b;--zsub:#5c5d65;--glowop:.55;color-scheme:light}
.phone.bw{--j0:var(--ink2);--j1:var(--ink2);--j2:var(--ink2);--sv:var(--ink);--inc:var(--ink3)}
/* gradient-depth marks (Tarun's "Dot depth" swatches) */
.m.solid.j0{fill:url(#gr-j0)}.m.solid.j1{fill:url(#gr-j1)}.m.solid.j2{fill:url(#gr-j2)}.m.solid.sv{fill:url(#gr-sv)}.m.solid.inc{fill:url(#gr-inc)}.m.solid.ink{fill:url(#gr-ink)}
.phone.bw .m.j1.solid{fill:url(#pt-stripe-j1)}.phone.bw .m.j2.solid{fill:url(#pt-dot-j2)}.phone.bw .m.j0.solid.pt{fill:url(#pt-stripe-j0)}

<div class="stage"><main class="phone" id="app" aria-label="Trickle prototype"></main></div>
<script>
/* ===== Trickle v12 — store: one ledger, derived reads, actions, 12 invariants, seeds =====
   Screens never compute their own totals; they call the reads below.
   Money arrives from linked UPI IDs or is typed in by hand. */
var L = null, UNDO = [], ACTN = 0;
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var JCLS = ['j0','j1','j2']; // amber, blue, plum; 4th jar reuses j0 + stripe pattern
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mk(y,m){return y+'-'+(m<9?'0':'')+(m+1);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function inr(n){n=Math.round(n);var neg=n<0;n=Math.abs(n);var s=String(n);if(s.length>3){var h=s.slice(0,-3);h=h.replace(/\B(?=(\d{2})+(?!\d))/g,',');s=h+','+s.slice(-3);}return (neg?'−':'')+'₹'+s;}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function curKey(){return mk(L.today.y,L.today.m);}
function cur(){return L.months[curKey()];}
function monthKeys(){return Object.keys(L.months).sort();}
function prevKey(k){var i=monthKeys().indexOf(k||curKey());return i>0?monthKeys()[i-1]:null;}
function uid(p){L.seq=(L.seq||0)+1;return (p||'x')+L.seq;}

/* ---------- derived reads ---------- */
function jarNames(m){m=m||cur();return Object.keys(m.jars);}
function jarSpent(j,m){m=m||cur();var s=0;m.spends.forEach(function(x){if(x.jar===j&&x.fund!=='lighter')s+=x.amt;});return s;}
function left(j,m){m=m||cur();var J=m.jars[j];return J.budget+J.moveIn-J.moveOut-jarSpent(j,m)+J.back;}
function jarCap(j,m){m=m||cur();var J=m.jars[j];return J.budget+J.moveIn-J.moveOut+J.back;}
function jarsTotal(m){m=m||cur();var s=0;jarNames(m).forEach(function(j){s+=m.jars[j].budget;});return s;}
function liveSubs(m){m=m||cur();return m.subs.filter(function(s){return s.state!=='stopped';});}
function subsTotal(m){return liveSubs(m).reduce(function(a,s){return a+s.amt;},0);}
function subsHeld(m){return liveSubs(m).filter(function(s){return s.state==='held';}).reduce(function(a,s){return a+s.amt;},0);}
function subsPaid(m){return subsTotal(m)-subsHeld(m);}
function spentAll(m){m=m||cur();return m.spends.reduce(function(a,x){return a+x.amt;},0);}
function backAll(m){m=m||cur();return jarNames(m).reduce(function(a,j){return a+m.jars[j].back;},0);}
function leftAll(m){m=m||cur();return jarNames(m).reduce(function(a,j){return a+left(j,m);},0);}
function capAll(m){m=m||cur();return jarNames(m).reduce(function(a,j){return a+jarCap(j,m);},0);}
function goalSaved(g){return g.saved;}
function savingsTotal(){return L.goals.reduce(function(a,g){return a+g.saved;},0)+L.general;}
function owedOpen(){return L.owed.reduce(function(a,o){return a+o.amt-o.back;},0);}
function incomeIn(m){m=m||cur();return m.incomes.reduce(function(a,i){return a+i.amt;},0);}
function daysLeft(){return dim(L.today.y,L.today.m)-L.today.d+1;}
function daySpread(j){var d=daysLeft();return Math.floor(left(j)/d);} // re-spread remaining days (P2e-Q5)
function paceFrac(){var m=cur(),cap=capAll(m);return cap?1-leftAll(m)/cap:0;}
function timeFrac(){return (L.today.d-0.5)/dim(L.today.y,L.today.m);}
function paceWord(){var d=paceFrac()-timeFrac();return d>0.12?'Quick':d<-0.12?'Easy':'Steady';}
function paceLine(){var w=paceWord();return w==='Quick'?'Spending a little quicker than the days':w==='Easy'?'Plenty of room for the days ahead':'Spending in step with the days';}
function repeatCount(payee,days){var m=cur(),d0=L.today.d-(days||7)+1,n=0;m.spends.forEach(function(x){if(x.payee===payee&&x.day>=d0&&x.day<=L.today.d)n++;});return n;}
function weekSpend(off){var m=cur(),e=L.today.d-7*(off||0),s=e-6,t=0;
  if(s<1&&off){var pk=prevKey();if(pk){var pm=L.months[pk],pd=dim(+pk.slice(0,4),+pk.slice(5)-1);pm.spends.forEach(function(x){if(x.day>=pd+s)t+=x.amt;});}}
  m.spends.forEach(function(x){if(x.day>=s&&x.day<=e)t+=x.amt;});return t;}
function topRepeat(){var m=cur(),c={};m.spends.forEach(function(x){if(x.amt<100)c[x.payee]=(c[x.payee]||0)+1;});var b=null;Object.keys(c).forEach(function(k){if(!b||c[k]>c[b])b=k;});return b;}
function equivalent(amt){var p=topRepeat()||'Ramu Tea Stall',u=L.payees[p]&&L.payees[p].unit||20;return {n:Math.round(amt/u),what:L.payees[p]&&L.payees[p].thing||'chais'};}
function ghost(j,k){var pk=prevKey(k);if(!pk)return null;var pm=L.months[pk];if(!pm.jars[j])return null;
  var s=0;pm.spends.forEach(function(x){if(x.jar===j&&x.day<=L.today.d&&x.fund!=='lighter')s+=x.amt;});return s;}
function smallBuys(m){m=m||cur();return m.spends.filter(function(x){return x.amt<100;});}
function catShare(m){m=m||cur();return jarNames(m).map(function(j){return {j:j,amt:jarSpent(j,m)};});}
function cashNow(m){m=m||cur();var inc=m.incomes.reduce(function(a,i){return a+(i.intent==='split'?i.amt:0);},0);
  return inc+m.fromSavings-m.savingsSplit-spentAll(m)-subsPaid(m)+backAll(m)+m.lighter-m.lighterIn+lighterFunded(m)*0;}
function lighterFunded(m){return m.spends.filter(function(x){return x.fund==='lighter';}).reduce(function(a,x){return a+x.amt;},0);}
function jcls(j,m){m=m||cur();return m.jars[j]?m.jars[j].c:'j0';}
function jpat(j,m){m=m||cur();return m.jars[j]&&m.jars[j].pat;}
function nextIncome(){var src=L.sources.filter(function(s){return s.kind==='regular';})[0];if(!src)return null;var d=src.day,t=L.today;
  var nm=t.m+1,ny=t.y;if(nm>11){nm=0;ny++;}var total=dim(t.y,t.m)-t.d+d;return {src:src,days:total,frac:1-total/dim(t.y,t.m),label:d+' '+MON[nm]};}
function goalEta(g){var per=1000;var need=g.target-g.saved;if(need<=0)return {months:0};var mths=Math.ceil(need/per);var m=L.today.m+mths,y=L.today.y+Math.floor(m/12);m%=12;return {months:mths,label:MON[m]+' '+y,onTime:true};}

/* ---------- invariants (12) ---------- */
function checkLedger(){var E=[];if(!L)return E;
  monthKeys().forEach(function(k){var m=L.months[k];
    var incSplit=m.incomes.reduce(function(a,i){return a+(i.intent==='split'?i.amt:0);},0);
    if(incSplit+m.fromSavings!==m.savingsSplit+m.budget)E.push('1 '+k+' income '+incSplit+'+'+m.fromSavings+' ≠ '+m.savingsSplit+'+'+m.budget);
    m.incomes.forEach(function(i){if(i.intent==='owed')E.push('1 '+k+' friend payback counted as income');});
    if(m.budget!==subsTotal(m)+jarsTotal(m)+m.lighterIn)E.push('2 '+k+' budget '+m.budget+' ≠ subs '+subsTotal(m)+' + jars '+jarsTotal(m)+' + lighter '+m.lighterIn);
    var mv=jarNames(m).reduce(function(a,j){return a+m.jars[j].moveIn-m.jars[j].moveOut;},0);if(mv!==0)E.push('2 '+k+' moves net '+mv);
    jarNames(m).forEach(function(j){if(left(j,m)<0)E.push('3 '+k+' '+j+' below zero '+left(j,m));});
    if(subsHeld(m)>m.budget-jarsTotal(m))E.push('4 '+k+' held subs exceed space');
    if(!m.closed){if(cashNow(m)!==leftAll(m)+subsHeld(m))E.push('6 '+k+' balance '+cashNow(m)+' ≠ left '+leftAll(m)+' + held '+subsHeld(m));}
    m.spends.forEach(function(x){if(x.refund&&x.refund>x.amt)E.push('7 refund > spend '+x.id);
      if(x.split){var s=x.split.own+x.split.friends.reduce(function(a,f){return a+f.share;},0);if(s!==x.amt)E.push('8 split '+x.id+' '+s+'≠'+x.amt);}});
    if(m.closed){if(!m.leftover||m.leftover.amt!==leftAll(m))E.push('9 '+k+' leftover '+(m.leftover&&m.leftover.amt)+' ≠ left '+leftAll(m));}
  });
  L.goals.forEach(function(g){var s=g.contribs.reduce(function(a,c){return a+c.amt;},0);if(s!==g.saved)E.push('5 goal '+g.name+' contribs '+s+' ≠ '+g.saved);if(g.saved<0)E.push('5 goal negative');});
  if(L.general<0)E.push('5 general savings negative');
  var gs=L.genLog.reduce(function(a,c){return a+c.amt;},0);if(gs!==L.general)E.push('5 general log '+gs+' ≠ '+L.general);
  L.owed.forEach(function(o){if(o.back>o.amt||o.back<0)E.push('6 owed '+o.friend+' back out of range');});
  L.needs.forEach(function(n){if(n.done)E.push('11 acted need still listed '+n.id);});
  /* 12: rendered marks — checked by dots.js self-test + DOM audit */
  if(window.__dotErr&&window.__dotErr.length)E.push('12 '+window.__dotErr.join(','));
  return E;}

/* ---------- actions: every action snapshots (undo), logs once to the bell, re-checks ---------- */
function act(kind,tab,text,amt,fn,opts){var snap=JSON.stringify(L);var r=fn();if(r===false)return false;
  var e={ts:stamp(),tab:tab,kind:kind,text:text,amt:amt};L.log.unshift(e);UNDO.push({snap:snap,label:text});if(UNDO.length>20)UNDO.shift();ACTN++;
  var err=checkLedger();if(err.length){window.__ledgerErr=(window.__ledgerErr||[]).concat(kind+': '+err.join('; '));}
  try{localStorage.setItem('trickle12',JSON.stringify(L));}catch(x){}
  return true;}
function undo(){var u=UNDO.pop();if(!u)return false;L=JSON.parse(u.snap);ACTN++;return u.label;}
function stamp(){return {d:L.today.d,m:L.today.m,h:L.clock||19};}
function needDone(id){L.needs=L.needs.filter(function(n){return n.id!==id;});}
function findSpend(id){var r=null;monthKeys().forEach(function(k){L.months[k].spends.forEach(function(x){if(x.id===id)r=x;});});return r;}

var A = {
 pay:function(o){ // o:{amt,jar,payee,src,split:[names]}
  var m=cur();if(!m.jars[o.jar])return false;if(o.amt<=0)return false;
  if(o.fund!=='lighter'&&left(o.jar)<o.amt)return false; // empty-jar flow must run first
  var payee=o.payee||'Payee';
  return act(o.src==='cash'?'cash':'pay','S',(o.src==='cash'?'Logged cash ':'Paid ')+inr(o.amt)+' · '+payee+' · '+o.jar,o.amt,function(){
   var x={id:uid('s'),day:L.today.d,hour:L.clock||19,payee:payee,amt:o.amt,jar:o.jar,src:o.src||'upi'};if(o.fund)x.fund=o.fund;
   if(o.split&&o.split.length){var n=o.split.length+1,sh=Math.floor(o.amt/n),own=o.amt-sh*o.split.length;x.split={own:own,friends:o.split.map(function(f){return {name:f,share:sh};})};
     o.split.forEach(function(f){L.owed.push({id:uid('o'),friend:f,spendId:x.id,amt:sh,back:0,what:payee});});}
   m.spends.push(x);var p=L.payees[payee]||(L.payees[payee]={jar:o.jar,kind:'shop',count:0});p.count++;});},
 take:function(from,to,amt){var m=cur();if(left(from)<amt)return false;
  return act('move','S','Moved '+inr(amt)+' from '+from+' to '+to,amt,function(){m.jars[from].moveOut+=amt;m.jars[to].moveIn+=amt;});},
 lighter:function(amt,jar,payee){var m=cur();
  return act('lighter','S','Next month starts '+inr(amt)+' lighter',amt,function(){m.lighter+=amt;L.nextLighter=(L.nextLighter||0)+amt;
   m.spends.push({id:uid('s'),day:L.today.d,hour:L.clock||19,payee:payee||'Payee',amt:amt,jar:jar,src:'upi',fund:'lighter'});});},
 useSavings:function(amt,jar){var m=cur();if(L.general+L.goals.reduce(function(a,g){return a+g.saved;},0)<amt)return false;
  return act('withdraw','V','Used '+inr(amt)+' from savings for '+jar,amt,function(){takeSavings(amt);m.fromSavings+=amt;m.budget+=amt;m.jars[jar].budget+=amt;});},
 income:function(amt,src,kind,intent,ow){var m=cur();
  if(intent==='owed'){var o=L.owed.filter(function(o){return o.id===ow;})[0];if(!o)return false;return A.payback(o.id,amt);}
  return act('income','I',(intent==='later'?'Kept for later ':'Split ')+inr(amt)+' from '+src,amt,function(){
   var i={id:uid('i'),src:src,kind:kind,amt:amt,day:L.today.d,intent:intent};m.incomes.push(i);
   if(intent==='later'){L.general+=amt;L.genLog.push({ts:stamp(),amt:amt,src:src});i.intent='later';return;}
   var sv=Math.round(amt*L.saveShare/100/100)*100,rest=amt-sv;m.savingsSplit+=sv;m.budget+=rest;i.split={save:sv,budget:rest};
   if(sv){var g=L.goals.filter(function(g){return !g.reachedTs;})[0];if(g){g.saved+=sv;g.contribs.push({ts:stamp(),amt:sv,src:'split'});}else{L.general+=sv;L.genLog.push({ts:stamp(),amt:sv,src:'split'});}}
   var names=jarNames(m),jt=jarsTotal(m)||1,given=0;names.forEach(function(j,ix){var add=ix===names.length-1?rest-given:Math.floor(rest*m.jars[j].budget/jt/10)*10;m.jars[j].budget+=add;given+=add;});});},
 sort:function(spendId,jar,remember,needId){var x=findSpend(spendId);if(!x)return false;var m=cur();if(jar!==x.jar&&left(jar)<x.amt)return false;
  return act('sort','S','Sorted '+inr(x.amt)+' '+x.payee+' → '+jar,x.amt,function(){x.jar=jar;x.sorted=true;if(remember){L.payees[x.payee]={jar:jar,kind:'shop',count:1};}if(needId)needDone(needId);});},
 refund:function(spendId,needId){var x=findSpend(spendId);if(!x)return false;var amt=x.refundPending||x.amt;
  return act('refund','S',inr(amt)+' back from '+x.payee+' → '+x.jar,amt,function(){x.refund=amt;delete x.refundPending;cur().jars[x.jar].back+=amt;if(needId)needDone(needId);});},
 split:function(spendId,friends,needId){var x=findSpend(spendId);if(!x||x.split)return false;
  return act('split','S','Split '+inr(x.amt)+' '+x.payee+' with '+friends.join(', '),x.amt,function(){var n=friends.length+1,sh=Math.floor(x.amt/n);
   x.split={own:x.amt-sh*friends.length,friends:friends.map(function(f){return {name:f,share:sh};})};friends.forEach(function(f){L.owed.push({id:uid('o'),friend:f,spendId:x.id,amt:sh,back:0,what:x.payee});});if(needId)needDone(needId);});},
 remind:function(oid){var o=L.owed.filter(function(o){return o.id===oid;})[0];if(!o)return false;
  return act('remind','S','Reminded '+o.friend+' about '+inr(o.amt-o.back),o.amt-o.back,function(){o.remindedTs=stamp();});},
 payback:function(oid,amt){var o=L.owed.filter(function(o){return o.id===oid;})[0];if(!o)return false;amt=Math.min(amt||o.amt-o.back,o.amt-o.back);if(amt<=0)return false;
  var x=findSpend(o.spendId);var j=x&&cur().jars[x.jar]?x.jar:jarNames()[0];
  return act('payback','S',o.friend+' paid back '+inr(amt)+' → '+j,amt,function(){o.back+=amt;cur().jars[j].back+=amt;});},
 move:function(from,to,amt){return A.take(from,to,amt);},
 setJar:function(j,amt){var m=cur(),J=m.jars[j];var diff=amt-J.budget;if(!diff)return false;
  var src=jarNames().filter(function(x){return x!==j;}).sort(function(a,b){return left(b)-left(a);})[0];
  if(diff>0&&left(src)<diff)return false;if(diff<0&&left(j)<-diff)return false;
  return act('jar','S',j+' set to '+inr(amt)+' ('+(diff>0?'from ':'to ')+src+')',Math.abs(diff),function(){J.budget=amt;m.jars[src].budget-=diff;});},
 addJar:function(name){var m=cur();if(!name||m.jars[name])return false;var n=jarNames().length;

function approxW(n){if(n<=12)return wn(n);var d=Math.round(n/12);return d>12?'dozens':wn(d)+' dozen';}

function rr(keep){if(keep){var sc=document.querySelector('.scr');S.keepScroll=sc?sc.scrollTop:null;}render();}
function done(ok,text,undoable){if(ok){toast(text,undoable!==false);}else toast('That didn’t fit. Nothing changed.',false);}
function keyIn(v,cur_){cur_=cur_||0;if(v==='⌫')return Math.floor(cur_/10);var n=parseInt(String(cur_)+v,10);return n>99999?cur_:n;}

 mvgo:function(){var c=S.ctx;if(!c.to)return;var ok=A.take(c.from||'Food',c.to,c.amt||100);fx('jar.respread');if(ok)back();else render();done(ok,'Moved '+inr(c.amt||100)+' to '+c.to);},
 copylast:function(){var ok=A.copyLast();back();done(ok,'Copied last month’s jars');},
 payeejar:function(el,v,c){act('payee','S',c.p+' → '+v,0,function(){L.payees[c.p].jar=v;});rr(1);},
 /* savings */
 gadd:function(el,v,c){var g0=L.goals.filter(function(x){return x.id===c.g;})[0],f0=g0?g0.saved/g0.target:0;var ok=A.addGoal(c.g,+v);var g=L.goals.filter(function(x){return x.id===c.g;})[0];fx('goal.add',null,{from:f0,to:g.saved/g.target});if(ok&&g.reachedTs&&g.reachedTs.d===L.today.d&&g.saved>=g.target){go('V-04',{g:g.id});}else render();done(ok,'Added '+inr(+v)+' to '+g.name);},
 withdraw:function(el,v,c){var ok=A.withdraw(c.g,c.a);back();done(ok,'Took out '+inr(c.a));},
 ng1:function(el,v){S.ctx={step:2,name:v};render();},
 ng1t:function(){var n=((document.getElementById('gname')||{}).value||'').trim();if(!n){toast('Type a name or pick one',false);render();return;}S.ctx={step:2,name:n};render();},
 ng2:function(el,v){S.ctx.step=3;S.ctx.amt=+v;render();},
 ng3:function(el,v){var ok=A.newGoal(S.ctx.name,S.ctx.amt,v==='No date'?null:v);S.hist=[];go('V-02',{},true);done(ok,'Goal added');},
 lrule:function(el,v){A.setPref('leftoverRule',v,'Leftover rule: '+(v==='savings'?'Savings':'next month'));render();},
 mend:function(el,v){var ok=A.monthEnd(v);if(ok&&v==='savings')fx('monthend.sweep');S.hist=[];go('N-04',{},true);done(ok,v==='savings'?'Moved to Savings':'Kept for next month');},
 /* insights */
 pin:function(el,v){A.pinInsight(v);rr(1);},
 checkin:function(){A.checkin();fx('week.fresh');back();toast('New week started',false);},
 cday:function(el,v){var c=Object.assign({},L.prefs.checkin,{dow:+v});A.setPref('checkin',c,'Check-in day changed');render();},
 ctime:function(el,v){var c=Object.assign({},L.prefs.checkin,{time:v});A.setPref('checkin',c,'Check-in time changed');render();},
 share:function(){toast('Poster ready to share',false);render();},
 /* app settings */
 pref:function(el,v,c){A.setPref(c.k,v,({look:'Look: ',motion:'Motion: '}[c.k]||'Appearance: ')+el.textContent);render();},
 ptog:function(el,v){A.setPref(v,!L.prefs[v],(L.prefs[v]?'Turned off ':'Turned on ')+v);render();},
 nch:function(el,v){act('notif','G','Notification channel '+v+' changed',0,function(){L.notif.channels[v]=!L.notif.channels[v];});render();},
 upitog:function(el,v){var u=L.upiIds.filter(function(u){return u.id===v;})[0];A.upi(v,!u.linked);render();},
 upiadd:function(){var v=((document.getElementById('newupi')||{}).value||'').trim();if(!/^[\w.\-]+@[\w]+$/.test(v)){toast('Type a UPI ID like name@bank',false);render();return;}A.upi(v,true);render();toast('Linked '+v,true);},
 csv:function(){var m=cur();S.ctx.csv='day,payee,jar,source,amount\n'+m.spends.map(function(x){return [x.day,x.payee,x.jar,x.src,x.amt].join(',');}).join('\n');try{navigator.clipboard.writeText(S.ctx.csv).catch(function(){});}catch(e){}render();},
 reset:function(){seedDemo();['H','I','S','V','N'].forEach(function(t){L.seen[t]=1;});S.hist=[];go('H-01',{},true);toast('Demo month restored',false);},
 nact:function(el,v){if(v==='income'){var ok=A.income(9000,'Allowance','regular','split');var m=cur();S.lastIncome=m.incomes[m.incomes.length-1].id;S.hist=[];go('I-01',{},true);done(ok,'Split '+inr(9000)+' · savings first');}
  else if(v==='subTomorrow'){var s=cur().subs.filter(function(s){return s.name==='Google One';})[0];go('S-05',{id:s.id});}
  else if(v==='checkin'){A.checkin();S.hist=[];go('N-01',{},true);toast('New week started',false);}
  else if(v==='story'){go('N-04');}else if(v==='welcome'){A.welcome();S.hist=[];go('H-01',{},true);}},
 welcome:function(){A.welcome();S.hist=[];go('H-01',{},true);}
};
/* payFrom: which tab the Pay button was pressed on */
document.addEventListener('click',function(e){var t=e.target.closest('.payb');if(t&&FR[S.scr])S.payFrom=FR[S.scr].tab==='P'?S.payFrom:FR[S.scr].tab;},true);
/* notifications simulation: calm few (P7-Q1) */
function notifSim(days){var sent=[],ch=L.notif.channels;var cand=[];for(var d=1;d<=days;d++){var dow=(d+2)%7;
  if(d===1||d===31)cand.push({d:d,h:9,type:'income'});if(d===14||d===21)cand.push({d:d,h:18,type:'subTomorrow'});if(dow===L.prefs.checkin.dow)cand.push({d:d,h:19.5,type:'checkin'});
  if(d===2)cand.push({d:d,h:20,type:'story'});if(d===12)cand.push({d:d,h:23,type:'welcome'});if(d===13)cand.push({d:d,h:10,type:'welcome'});}
  var pri={income:0,subTomorrow:1,welcome:2,checkin:3,story:4};cand.sort(function(a,b){return a.d-b.d||pri[a.type]-pri[b.type];});
  cand.forEach(function(c){if(!ch[c.type])return;var h=c.h;if(h>=22||h<8){c.h=h>=22?8:8;c.d+=h>=22?1:0;}
    if(sent.some(function(s){return s.d===c.d;}))return;var wk=Math.floor((c.d-1)/7);if(sent.filter(function(s){return Math.floor((s.d-1)/7)===wk;}).length>=3)return;sent.push(c);});
  return sent;}


S.ob.t0=Date.now();window.addEventListener('hashchange',function(){boot();});boot();
