<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Trickle — v10</title>
<meta name="description" content="Clickable prototype of Trickle v10: a UPI student budgeting app where every amount is drawn as shapes: dot ₹10, square ₹50, triangle ₹100, diamond ₹500, coin ₹1000, star ₹5000.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500&display=swap">
<style>/* Layout: a single phone column centred on an ink stage; tiles are the only chart language. Dark-only by design (the concept's ink ground). */
:root{
 --stage:#070707;--ink:#0B0B0C;--surface:#141414;--surface2:#1D1E20;--surface3:#27282B;--border:#26272A;
 --text:#F4F4F2;--text2:#A9AAAD;--text3:#7C7D82;--slot:#4a4b50;
 --accent:#C6F432;--on-accent:#141414;--save:#C6F432;--calm:#4FD18B;--warm:#F2A93B;--bone:#EDE9DC;--fillg:#B8B4A8;
 --food:#DC6A30;--travel:#3F8CE6;--fun:#D55181;--ess:#9085E9;--uns:#8a8b90;--laundry:#4FB6C4;--books:#B98B5E;
 --ease-out:cubic-bezier(.2,.8,.2,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);--ease-in-out:cubic-bezier(.65,0,.35,1);
 --font:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 --display:"Fraunces",Georgia,serif;
 color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--stage)}
body{margin:0;background:var(--stage);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:16px;display:flex;justify-content:center}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phone{position:relative;width:412px;max-width:100%;height:min(860px,calc(100vh - 32px));min-height:600px;border-radius:34px;background:var(--ink);border:1px solid #2a2a2c;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.viewport{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;z-index:1}
.scr{padding:18px 18px 28px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1;min-height:100%}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);background:rgba(11,11,12,.95);position:relative;z-index:3;padding:4px 0 8px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--text3);background:none;border:0;min-height:52px;cursor:pointer;position:relative}
.tabs button[aria-current="page"]{color:var(--text)}
.tabs button .dot{position:absolute;top:6px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--accent)}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--surface3);border:1px solid var(--border);display:grid;place-items:center;font-weight:700;cursor:pointer;flex:none}
.hello{font-size:13px;color:var(--text2)}
h1{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--text2)}.faint{color:var(--text3)}
.lbl{font-size:11.5px;color:var(--text3);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;cursor:pointer;padding:0 16px}
.btn.sec{background:var(--surface2);color:var(--text);font-weight:600;min-height:48px;font-size:14.5px;border:1px solid var(--border)}
.btn.ghost{background:none;color:var(--text2);font-weight:600;min-height:44px;font-size:14px}
.btn.sm{min-height:44px;font-size:14px;border-radius:14px;width:auto}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.card{background:rgba(29,30,32,.82);border:1px solid var(--border);border-radius:20px;padding:14px;backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:10px;min-width:0}
.card.tap{cursor:pointer;text-align:left;width:100%}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px}
.link{background:none;border:0;color:var(--text2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0 4px;font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--text);background:var(--surface3)}
.chip.sug{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cdot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.07)}
.pill.calm{color:var(--calm)}.pill.warm{color:var(--warm)}.pill.save{color:var(--save)}
/* tiles */
.tg{display:grid;gap:var(--g,4px);grid-template-columns:repeat(var(--c),var(--s,14px));justify-content:start}
.tg.center{justify-content:center}
.tg i{width:var(--s,14px);height:var(--s,14px);border-radius:calc(var(--s,14px)*.24);background:transparent;box-shadow:inset 0 0 0 1.5px var(--slot);display:block;transition:transform .7s cubic-bezier(.5,0,.3,1),opacity .7s,background-color .5s,box-shadow .4s}
.tg i.f{box-shadow:none}
.tg i.h{opacity:.45}
.tg i.ch{box-shadow:0 0 0 2px #fff inset}
.tg i{position:relative}
.tg i.ch::after{content:"";position:absolute;inset:0;border-radius:inherit;background:inherit;opacity:0}
.go .tg i.ch{background-color:transparent!important;box-shadow:inset 0 0 0 1.5px var(--slot);transition-delay:var(--d,0ms)}
.go .tg i.ch::after{animation:flyout .8s both;animation-delay:var(--d,0ms)}
@keyframes flyout{0%{opacity:1;transform:none;background:#fff}100%{opacity:0;transform:translateY(-40px) scale(.3)}}
.tg i.ov{background:rgba(242,169,59,.22);box-shadow:inset 0 0 0 2px var(--warm);border:0;outline:1.5px dashed var(--warm);outline-offset:-1.5px}
.tg i.pop{animation:popin .5s both}
@keyframes popin{from{transform:scale(0);opacity:0}}
.tagv{display:inline-block;background:var(--surface3);border:1px solid var(--border);border-radius:10px;padding:3px 9px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.revealable{cursor:pointer}
/* glow */
.glow{position:absolute;left:0;right:0;top:0;height:330px;z-index:0;pointer-events:none;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:62px;gap:8px;padding:8px;filter:blur(22px);-webkit-mask-image:linear-gradient(#000 25%,transparent);mask-image:linear-gradient(#000 25%,transparent)}
.glow i{border-radius:10px;background-color:var(--gc);transition:background-color 1.6s ease,opacity 1.6s;animation:breathe 6s ease-in-out infinite alternate}
.glow i:nth-child(3n){animation-delay:-2s}.glow i:nth-child(4n){animation-delay:-4s}
@keyframes breathe{to{opacity:.35}}
.glow.reset i{animation:resetT 1.4s both}
@keyframes resetT{0%{transform:scale(.2);opacity:0}100%{transform:none}}
/* lists */
.tx{display:flex;align-items:center;gap:12px;padding:8px 2px;min-height:52px;border:0;border-bottom:1px solid var(--border);cursor:pointer;background:none;width:100%;text-align:left}
.tx:last-child{border-bottom:0}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m small{display:block;color:var(--text3);font-size:12.5px}
.tx .amt{font-variant-numeric:tabular-nums;font-weight:600}
.tx .amt.in{color:var(--save)}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface3);flex:none}
/* accordion */
.acc{background:rgba(29,30,32,.82);border:1px solid var(--border);border-radius:22px;overflow:hidden}
.acc>button{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:none;border:0;cursor:pointer;text-align:left;min-height:64px}
.acc>button .t{flex:1;min-width:0}
.acc>button .t small{display:block;color:var(--text2);font-size:13px}
.chev{transition:transform .4s cubic-bezier(.3,.7,.2,1);color:var(--text3)}
.acc[data-open="1"] .chev{transform:rotate(180deg)}
.acc .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.3,.7,.2,1)}
.acc[data-open="1"] .body{grid-template-rows:1fr}
.acc .body>div{overflow:hidden;visibility:hidden;transition:visibility 0s .45s}
.acc[data-open="1"] .body>div{visibility:visible;transition:visibility 0s}
.acc .inner{padding:0 14px 16px;display:flex;flex-direction:column;gap:14px}
/* overlays */
.sheet{position:absolute;inset:0;z-index:10;background:var(--ink);display:flex;flex-direction:column;animation:up .35s cubic-bezier(.3,.7,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:12px 12px 4px}
.sheet .sb{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 18px 22px;display:flex;flex-direction:column;gap:16px}
.sheet .sf{padding:12px 18px 18px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border)}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface2);display:grid;place-items:center;cursor:pointer;flex:none}
.steps{display:flex;gap:5px;flex:1;justify-content:center}
.steps i{width:22px;height:5px;border-radius:3px;background:var(--surface3)}
.steps i.on{background:var(--text)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;animation:fade .2s}
.drawer{position:absolute;top:0;bottom:0;left:0;width:86%;background:var(--surface);z-index:21;display:flex;flex-direction:column;animation:slide .3s cubic-bezier(.3,.7,.2,1);border-right:1px solid var(--border)}
@keyframes slide{from{transform:translateX(-100%)}}
.set{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 4px;border-bottom:1px solid var(--border);width:100%;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer;text-align:left}
.set .t{flex:1;min-width:0}.set small{display:block;color:var(--text3);font-size:12.5px}
.seg{display:flex;background:var(--surface3);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;min-height:40px;padding:0 12px;cursor:pointer;color:var(--text2);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text)}
/* keypad */
.amt-big{font-family:var(--display);font-size:52px;text-align:center;font-variant-numeric:tabular-nums;min-height:70px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{min-height:56px;border-radius:16px;border:0;background:var(--surface2);font-size:22px;font-weight:600;cursor:pointer}
input.fld{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:0 14px;font:inherit;font-size:15px}
.stage{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:24px;background:rgba(20,20,20,.7);border:1px solid var(--border);padding:18px 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border-radius:16px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;text-align:left}
.opt .t{flex:1}.opt small{display:block;color:var(--text2);font-size:12.5px}
.opt.def{border-color:var(--accent)}
.toast{position:absolute;left:16px;right:16px;bottom:78px;z-index:30;background:var(--surface3);border:1px solid var(--border);border-radius:16px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:10px;animation:fade .25s}
.toast .t{flex:1}
.moment{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:12px 0}
.moment .big{font-family:var(--display);font-size:28px;line-height:1.15;text-wrap:balance}
.pinrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pinrow .card.wide{grid-column:1/-1}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars span{width:100%;border-radius:6px 6px 3px 3px;background:var(--text3)}
.bars small{font-size:11.5px;color:var(--text3)}
.split3{display:flex;justify-content:center;align-items:flex-start;gap:18px;flex-wrap:wrap}
.split3 .lab{font-size:12px;color:var(--text2);text-align:center;margin-top:6px}
.story{position:absolute;inset:0;z-index:12;background:var(--ink);display:flex;flex-direction:column}
.story .prog{display:flex;gap:4px;padding:14px 14px 0}
.story .prog i{flex:1;height:3px;border-radius:2px;background:var(--surface3)}
.story .prog i.on{background:var(--text)}
.story .sb{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:18px 22px;overflow-y:auto}
.inbox{display:flex;flex-direction:column;gap:12px}
.more{display:flex;flex-wrap:wrap;gap:8px}
#inv{display:none}
.rm *,.rm *::before,.rm *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0ms!important}}
@media (max-width:440px){body{padding-inline:0;padding-block:0}.phone{border-radius:0;border:0;height:100vh;min-height:0;width:100%}}

.still .sheet,.still .drawer,.still .scrim,.still .story{animation:none}

/* ================= v9 ================= */
/* B&W look (option): pure black ground, white glow, grey ramp + pattern per category */
html[data-look="bw"]{--stage:#000;--ink:#000;--surface:#111;--surface2:#1A1A1A;--surface3:#242424;--border:#2B2B2B;--slot:#565656;
 --text:#F5F5F5;--text2:#A3A3A3;--text3:#6B6B6B;--accent:#FFFFFF;--on-accent:#000;--save:#FFFFFF;--calm:#D9D9D9;--warm:#8A8A8A;--bone:#CFCFCF;--fillg:#9A9A9A;
 --food:#F2F2F2;--travel:#BDBDBD;--fun:#8A8A8A;--ess:#6B6B6B;--uns:#555;--laundry:#9f9f9f;--books:#7a7a7a}
html[data-look="bw"] .phone{border-color:#222}
html[data-look="bw"] .k2.f,html[data-look="bw"] .cdot.k2,html[data-look="bw"] .stk i.k2{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.6) 0 1.5px,transparent 1.5px 4px)}
html[data-look="bw"] .k3.f,html[data-look="bw"] .cdot.k3,html[data-look="bw"] .stk i.k3{background-image:radial-gradient(rgba(0,0,0,.65) 1.1px,transparent 1.4px);background-size:4px 4px}
html[data-look="bw"] .k4.f,html[data-look="bw"] .cdot.k4,html[data-look="bw"] .stk i.k4{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 1.5px,transparent 1.5px 4px)}
html[data-look="bw"] .tg i.sv.f{box-shadow:0 0 8px #fff8}
html[data-look="bw"] .pill.warm{border:1px dashed var(--warm)}
html[data-look="bw"] .sk .band{stroke-opacity:.3}
/* tiles: partial, glow, outlined */
.tg.wrap{display:flex;flex-wrap:wrap}
.tg i.pt{background:linear-gradient(to top,var(--tc) calc(var(--p)*100%),transparent calc(var(--p)*100%));box-shadow:inset 0 0 0 1.5px var(--tc)}
.tg i.gl.f{box-shadow:0 0 7px color-mix(in srgb,var(--tc) 60%,transparent)}
.tg i.ol{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text2)}
.tg i.tgt{box-shadow:inset 0 0 0 2px var(--save);border-radius:50%}
.tg.path i,.tg.dots i{border-radius:50%}
.tkey{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums;white-space:nowrap}
.tkey i{width:10px;height:10px;border-radius:2.5px;background:var(--text3);flex:none}
.tkey i.sv{background:var(--save)}.tkey i.g2{background:var(--text2)}.tkey i.dot{border-radius:50%}.tkey i.ol{background:none;box-shadow:inset 0 0 0 1.5px var(--text2)}.tkey i.ln{height:1.5px;border-radius:0}
.tkey.sz{margin-right:auto;margin-left:10px}
.szd{display:inline-flex;gap:2px;flex:none}.szd i{width:6px;height:6px;border-radius:50%;background:var(--surface3)}
/* widget cards (ref: rounded tiles, title top-left, settings top-right, key bottom-left) */
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px;grid-auto-flow:dense}
.wc{background:linear-gradient(180deg,rgba(38,39,42,.9),rgba(26,27,29,.9));border:1px solid var(--border);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
html[data-look="bw"] .wc{background:linear-gradient(180deg,#171717,#0d0d0d)}
.wc.W,.wc.L{grid-column:1/-1}
.wh{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.wt{font-weight:600;font-size:14.5px}
.gear{width:44px;height:44px;margin:-8px -8px -8px 0;border:0;background:none;color:var(--text2);border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease-out)}
.gear:hover{transform:rotate(30deg)}
.wb{min-width:0}
.wcap{font-size:13px;color:var(--text2);margin:0}
.wf{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:18px;flex-wrap:wrap}
.wtip .tagv{font-size:12px}
.addw{align-items:center;justify-content:center;aspect-ratio:1/1;max-height:140px;color:var(--text2);cursor:pointer;gap:8px;font-weight:600;font-size:13px}
.wprev .wc{pointer-events:none}
.wsz{width:28px;height:28px;border-radius:8px;background:var(--surface3);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--text2)}
.link.inl{min-height:0;padding:0;font-size:13px;display:inline}
.rows{display:flex;flex-direction:column;gap:7px}
.rw{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center;cursor:pointer;min-height:22px}
.rl{font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw2{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center}
.rw2 .rl{flex-wrap:wrap}.rw2 .rl small{flex-basis:100%;padding-left:16px;color:var(--text3);font-size:11px}
.rw2 .st{display:flex;flex-direction:column;gap:3px}
.cols{display:flex;align-items:flex-end;gap:14px;justify-content:space-around;min-height:60px}
.cols.c7{gap:4px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px}
.col small{font-size:11px;color:var(--text3)}
.tg.up{display:flex;flex-wrap:wrap-reverse;width:calc(var(--c)*var(--s) + (var(--c) - 1)*var(--g))}
.lgd{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--text2)}.lgd>span{display:inline-flex;align-items:center;gap:6px}
/* dot-matrix months */
.dm{display:flex;justify-content:space-between;gap:8px}
.dmm{display:flex;flex-direction:column;align-items:center;gap:6px}
.dml{font-size:12.5px;color:var(--text2)}
.dmg{display:grid;grid-template-columns:repeat(7,6px);gap:5px}
.dmg i{width:6px;height:6px;border-radius:50%;background:var(--text);cursor:pointer}
.dmg i.lv0{opacity:.14}.dmg i.lv1{opacity:.32}.dmg i.lv2{opacity:.55}.dmg i.lv3{opacity:.8}.dmg i.lv4{opacity:1;box-shadow:0 0 6px 1px rgba(255,255,255,.55)}
.dmg i.lvf{background:none;box-shadow:inset 0 0 0 1px var(--text3);opacity:.5;cursor:default}
.dmg i.td{box-shadow:0 0 0 2px var(--ink),0 0 0 3.5px var(--save);opacity:1}
.frq{display:flex;flex-direction:column;gap:6px}.frr{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:6px}.frr span{font-size:10.5px;color:var(--text3);white-space:nowrap}

 if(ref==='new_money')p.nm+=a;
 else if(ref.indexOf('budget:')===0){var c=ref.slice(7);p.b[c]=(p.b[c]||0)+a;}

 else if(t.type==='transfer'){t.src.forEach(function(x){refAdd(p,x.ref,-x.amt);});t.dst.forEach(function(x){refAdd(p,x.ref,x.amt);});}

var MERCH={
 Food:[['JD Canteen',60,160,[12,14,20,22]],['Kameng Mess',90,200,[13,14,19,21]],['Swiggy',180,360,[20,23]],['Chai Tapri',15,40,[16,19]],['Campus Coffee',25,60,[8,10]]],
